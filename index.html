<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Терминал заказа</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    /* Основные кнопки */
    .btn {
      display: inline-block;
      padding: 16px 26px;
      font-size: 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      margin: 4px;
    }

    .btn-primary {
      background: #ff0000;
      color: white;
    }

    .btn-secondary {
      background: #dddddd;
      color: #333;
    }

    .hidden {
      display: none !important;
    }

    /* Контейнер категорий */
    #categoriesBar {
      width: 100%;
      height: 90px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 2px solid #eee;
      background: #fafafa;
    }

    .category {
      display: inline-block;
      padding: 20px 30px;
      font-size: 24px;
      cursor: pointer;
    }

    .category.active {
      background: #ff0000;
      color: white;
      border-radius: 12px;
    }

    /* Товары */
    #productsArea {
      padding: 20px;
      height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .productCard {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
    }

    .productCard img {
      width: 130px;
      height: 130px;
      border-radius: 12px;
      margin-right: 20px;
      object-fit: cover;
    }

    .productInfo {
      flex-grow: 1;
    }

    .productName {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .productPrice {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* Кнопка корзины */
    #cartButton {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #ff0000;
      color: white;
      font-size: 28px;
      padding: 16px 26px;
      border-radius: 50px;
      cursor: pointer;
    }

    /* Скрытые кнопки PIN входа */
    #secretRight,
    #secretLeft {
      position: fixed;
      width: 50px;
      height: 50px;
      bottom: 0;
      opacity: 0; /* невидимые */
    }

    #secretRight {
      right: 0;
    }

    #secretLeft {
      left: 0;
    }

    /* PIN окно */
    #pinModal {
      position: fixed;
      left: 0; right: 0; top: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #pinBox {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 400px;
      text-align: center;
    }

    #pinInput {
      font-size: 32px;
      padding: 12px;
      width: 80%;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid #ccc;
    }

    /* Модалка корзины */
    #cartModal {
      position: fixed;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #cartBox {
      background: #ffffff;
      width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 20px;
    }

    /* Модалка оплаты */
    #payModal {
      position: fixed;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #payBox {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      text-align: center;
    }

    #qrImage {
      width: 300px;
      height: 300px;
      margin: 20px auto;
      object-fit: contain;
    }

  </style>
</head>
<body>

  <!-- Секретные невидимые кнопки -->
  <div id="secretLeft"></div>
  <div id="secretRight"></div>

  <!-- Категории -->
  <div id="categoriesBar"></div>

  <!-- Товары -->
  <div id="productsArea"></div>

  <!-- Корзина -->
  <div id="cartButton">Корзина</div>

  <!-- PIN окно -->
  <div id="pinModal" class="hidden">
    <div id="pinBox">
      <h2>Введите PIN</h2>
      <input id="pinInput" type="password" maxlength="6">
      <br><br>
      <button class="btn btn-primary" id="pinSubmit">Войти</button>
      <br><br>
      <button class="btn btn-secondary" id="pinClose">Отмена</button>
    </div>
  </div>

  <!-- Корзина -->
  <div id="cartModal" class="hidden">
    <div id="cartBox">
      <h2>Корзина</h2>
      <div id="cartItems"></div>

      <br>
      <button class="btn btn-secondary" id="editCart">Изменить</button>
      <button class="btn btn-primary" id="confirmCart">Подтвердить</button>

      <br><br>
      <button class="btn" id="closeCart">Закрыть</button>
    </div>
  </div>

  <!-- Оплата -->
  <div id="payModal" class="hidden">
    <div id="payBox">
      <h2>Оплатите заказ</h2>

      <img id="qrImage" src="" alt="QR">

      <p>После оплаты заказ автоматически отправится.</p>

      <button class="btn btn-secondary" id="payClose">Закрыть</button>
    </div>
  </div>
//далеее//
    <script>
  /* =========================================================
     НАСТРОЙКИ / КОНФИГ
     ========================================================= */

  const LS_CONFIG_KEY = "app_config_v1";
  const LS_DASH_KEY   = "dashboard_orders_v1";
  const PIN_CODE      = "65Vafuza";      // твой PIN
  const PIN_OK_KEY    = "PIN_OK";
  const WANT_ROUTE_KEY= "WANT_ROUTE";

  // меню по умолчанию (если нет в localStorage)
  const DEFAULT_CONFIG = {
    brandTitle: "ЯмаMoto",
    sbpPayBaseUrl: "",  // пока пусто, позже можно использовать
    menu: [
      {
        key: "burgers",
        title: "Бургеры",
        items: [
          { name: "Говяжий бургер", price: 280, img: "https://images.unsplash.com/photo-1603064752734-4c48eff53d05?w=400&auto=format&fit=crop" },
          { name: "Говяжий двойной", price: 440, img: "https://images.unsplash.com/photo-1516684541-b4de0a07a2e1?w=400&auto=format&fit=crop" },
          { name: "Куриный бургер",  price: 200, img: "https://images.unsplash.com/photo-1604908176997-1251882fde0b?w=400&auto=format&fit=crop" },
          { name: "Куриный двойной", price: 250, img: "https://images.unsplash.com/photo-1603366615917-1fa6dad5c4fa?w=400&auto=format&fit=crop" },
          { name: "Чизбургер", price: 220, img: "" }
        ]
      },
      {
        key: "twisters",
        title: "Твистеры",
        items: [
          { name: "Твистер обычный", price: 200, img: "" },
          { name: "Твистер обычный с картошкой", price: 220, img: "" },
          { name: "Твистер макс", price: 250, img: "" },
          { name: "Твистер макс с картошкой", price: 280, img: "" }
        ]
      },
      {
        key: "drinks",
        title: "Напитки",
        items: [
          { name: "Добрый кола", price: 100, img: "" },
          { name: "Добрый апельсин", price: 100, img: "" },
          { name: "Добрый лайм", price: 100, img: "" },
          { name: "Флэт-уайт", price: 100, img: "" },
          { name: "Раф банан", price: 100, img: "" },
          { name: "Эспрессо", price: 100, img: "" }
        ]
      },
      {
        key: "sushi",
        title: "Суши / роллы",
        items: [
          { name: "Калифорния", price: 350, img: "" },
          { name: "Филадельфия", price: 390, img: "" },
          { name: "Аляска", price: 350, img: "" }
        ]
      }
    ]
  };

  function loadConfig() {
    try {
      const raw = localStorage.getItem(LS_CONFIG_KEY);
      if (!raw) return DEFAULT_CONFIG;
      const json = JSON.parse(raw);
      if (!json || !Array.isArray(json.menu)) return DEFAULT_CONFIG;
      return json;
    } catch {
      return DEFAULT_CONFIG;
    }
  }

  function saveConfig(cfg) {
    localStorage.setItem(LS_CONFIG_KEY, JSON.stringify(cfg));
  }

  /* =========================================================
     УТИЛИТЫ
     ========================================================= */

  function $(id){ return document.getElementById(id); }

  function money(n){
    return (n || 0) + " руб.";
  }

  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    setTimeout(() => t.classList.add("hidden"), 1500);
  }

  function loadDash(){
    try {
      return JSON.parse(localStorage.getItem(LS_DASH_KEY) || "[]");
    } catch {
      return [];
    }
  }
  function saveDash(arr){
    localStorage.setItem(LS_DASH_KEY, JSON.stringify(arr || []));
  }

  /* =========================================================
     ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЭКРАНА ТЕРМИНАЛА
     ========================================================= */

  const cfg = loadConfig();
  let activeCatIndex = 0;

  // корзина: { "name": { qty, price, img } }
  let cart = {};

  /* =========================================================
     РЕНДЕР КАТЕГОРИЙ
     ========================================================= */

  function renderCategories(){
    const bar = $("categoriesBar");
    bar.innerHTML = "";

    cfg.menu.forEach((cat, idx) => {
      const div = document.createElement("div");
      div.className = "category " + (idx === activeCatIndex ? "active" : "");
      div.textContent = cat.title;

      div.onclick = () => {
        activeCatIndex = idx;
        renderCategories();
        renderProducts();
      };

      bar.appendChild(div);
    });
  }

  /* =========================================================
     РЕНДЕР ТОВАРОВ
     ========================================================= */

  function renderProducts(){
    const area = $("productsArea");
    area.innerHTML = "";

    const cat = cfg.menu[activeCatIndex];
    if (!cat) return;

    cat.items.forEach(item => {
      const card = document.createElement("div");
      card.className = "productCard";

      const img = document.createElement("img");
      img.src = item.img || "https://placehold.co/160x160?text=food";

      const info = document.createElement("div");
      info.className = "productInfo";

      const name = document.createElement("div");
      name.className = "productName";
      name.textContent = item.name;

      const price = document.createElement("div");
      price.className = "productPrice";
      price.textContent = money(item.price);

      const controls = document.createElement("div");

      const dec = document.createElement("button");
      dec.className = "btn btn-secondary";
      dec.textContent = "−";
      dec.onclick = () => changeQty(item, -1);

      const qty = document.createElement("span");
      qty.style.fontSize = "28px";
      qty.style.margin = "0 18px";
      qty.id = "qty_" + item.name;

      const inc = document.createElement("button");
      inc.className = "btn btn-primary";
      inc.textContent = "+";
      inc.onclick = () => changeQty(item, +1);

      controls.appendChild(dec);
      controls.appendChild(qty);
      controls.appendChild(inc);

      info.appendChild(name);
      info.appendChild(price);
      info.appendChild(controls);

      card.appendChild(img);
      card.appendChild(info);

      area.appendChild(card);

      updateQtyLabel(item.name);
    });
  }

  function changeQty(item, delta){
    const key = item.name;
    if (!cart[key]) cart[key] = { qty: 0, price: item.price, img: item.img };
    cart[key].qty = Math.max(0, cart[key].qty + delta);
    if (cart[key].qty === 0) delete cart[key];

    updateQtyLabel(key);
    updateCartButton();
  }

  function updateQtyLabel(name){
    const el = $("qty_" + name);
    if (!el) return;
    el.textContent = cart[name]?.qty || 0;
  }

  function updateCartButton(){
    const btn = $("cartButton");
    const totalQty = Object.values(cart).reduce((s, x) => s + x.qty, 0);
    btn.textContent = totalQty > 0 ? ("Корзина (" + totalQty + ")") : "Корзина";
  }

  /* =========================================================
     КОРЗИНА / МОДАЛКА
     ========================================================= */

  function openCart(){
    const modal = $("cartModal");
    const itemsBox = $("cartItems");
    itemsBox.innerHTML = "";

    const entries = Object.entries(cart);
    if (!entries.length){
      itemsBox.innerHTML = "<p>Корзина пуста</p>";
    } else {
      let total = 0;

      entries.forEach(([name, data]) => {
        const row = document.createElement("div");
        row.style.fontSize = "22px";
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.marginBottom = "12px";

        const left = document.createElement("div");
        left.textContent = name + " × " + data.qty;

        const right = document.createElement("div");
        const sum = data.qty * data.price;
        total += sum;
        right.textContent = money(sum);

        row.appendChild(left);
        row.appendChild(right);

        itemsBox.appendChild(row);
      });

      const totRow = document.createElement("div");
      totRow.style.fontSize = "26px";
      totRow.style.fontWeight = "bold";
      totRow.style.marginTop = "16px";
      totRow.textContent = "Итого: " + money(total);
      itemsBox.appendChild(totRow);
    }

    modal.classList.remove("hidden");
  }

  function closeCart(){
    $("cartModal").classList.add("hidden");
    // возвращаем кнопки корзины на место
    $("confirmCart").classList.remove("hidden");
    $("editCart").classList.remove("hidden");
    if ($("payChoice")) $("payChoice").remove();
  }

  // шаг 2: выбор оплаты
  function showPayChoice(){
    const box = $("cartBox");

    // скрываем старые кнопки
    $("confirmCart").classList.add("hidden");
    $("editCart").classList.add("hidden");

    // блок выбора
    const choice = document.createElement("div");
    choice.id = "payChoice";
    choice.style.marginTop = "20px";
    choice.innerHTML = `
      <h3 style="font-size:24px;margin-bottom:8px;">Способ оплаты</h3>
      <button id="payByQr" class="btn btn-primary" style="width:100%;margin-bottom:10px;">QR (СБП)</button>
      <button id="payByCard" class="btn btn-secondary" style="width:100%;">Картой</button>
    `;
    box.appendChild(choice);

    $("payByQr").onclick = () => finalizeOrder("sbp");
    $("payByCard").onclick = () => finalizeOrder("card");
  }

  /* =========================================================
     ОТПРАВКА ЗАКАЗА
     ========================================================= */

  async function sendOrderToApi(orderPayload){
    // пока API не трогаем — пробуем отправить, если не получится — не падаем
    try {
      const res = await fetch("/api/order", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ op:"create", ...orderPayload })
      });
      const json = await res.json().catch(()=>null);
      return json;
    } catch {
      return null;
    }
  }

  async function finalizeOrder(payType){
    const entries = Object.entries(cart);
    if (!entries.length){
      toast("Корзина пуста");
      return;
    }

    const items = entries.map(([name, d]) => ({
      name,
      qty: d.qty,
      price: d.price
    }));

    const total = items.reduce((s,i)=> s + i.qty*i.price, 0);

    // собираем заказ
    let order = {
      id: Date.now().toString().slice(-6),
      createdAt: Date.now(),
      items,
      total,
      pay: payType,
      status: "готовится"  // по умолчанию
    };

    // пробуем API
    const apiRes = await sendOrderToApi({ items, total, pay: payType });
    if (apiRes?.order) order = apiRes.order;

    // пишем в табло локально
    const dash = loadDash();
    dash.unshift(order);
    saveDash(dash.slice(0,200));

    // чистим корзину
    cart = {};
    updateCartButton();
    renderProducts();

    closeCart();

    // QR оплата → открыть payModal
    if (payType === "sbp"){
      openQrModal();
    } else {
      toast("Оплатите на кассе");
    }
  }

  /* =========================================================
     QR МОДАЛКА
     ========================================================= */

  let qrTimer = null;

  function openQrModal(){
    const m = $("payModal");
    const img = $("qrImage");

    // берем URL картинки из localStorage
    const qrUrl = localStorage.getItem("qr_url") || "";
    if (qrUrl){
      img.src = qrUrl;
    } else {
      img.src = "https://placehold.co/300x300?text=QR+URL+empty";
    }

    m.classList.remove("hidden");

    // авто-закрытие через 20 сек
    if (qrTimer) clearTimeout(qrTimer);
    qrTimer = setTimeout(() => {
      m.classList.add("hidden");
    }, 20000);
  }

  function closeQrModal(){
    $("payModal").classList.add("hidden");
    if (qrTimer) clearTimeout(qrTimer);
  }

  // клик по свободному месту → закрыть
  $("payModal").addEventListener("click", (e) => {
    if (e.target.id === "payModal") closeQrModal();
  });

  $("payClose").onclick = closeQrModal;

  /* =========================================================
     PIN ЛОГИКА + 8 ТАПОВ В УГЛАХ
     ========================================================= */

  function openPinModal(targetRoute){
    sessionStorage.setItem(WANT_ROUTE_KEY, targetRoute);
    $("pinInput").value = "";
    $("pinModal").classList.remove("hidden");
    $("pinInput").focus();
  }

  function closePinModal(){
    $("pinModal").classList.add("hidden");
  }

  $("pinSubmit").onclick = () => {
    const val = $("pinInput").value.trim();
    if (val !== PIN_CODE){
      toast("Неверный PIN");
      return;
    }
    sessionStorage.setItem(PIN_OK_KEY, "1");
    closePinModal();

    const route = sessionStorage.getItem(WANT_ROUTE_KEY) || "#/dashboard";
    sessionStorage.removeItem(WANT_ROUTE_KEY);
    location.hash = route;
  };

  $("pinClose").onclick = closePinModal;

  function bindSecretTaps(el, route){
    let taps = 0;
    let firstTime = 0;
    let timer = null;
    const winMs = 1500;

    function reset(){
      taps = 0;
      firstTime = 0;
      if (timer) { clearTimeout(timer); timer = null; }
    }

    el.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

      const now = Date.now();
      if (!firstTime) firstTime = now;
      taps++;

      if (now - firstTime > winMs){
        reset();
        taps = 1;
        firstTime = now;
      }

      if (taps >= 8){
        reset();
        openPinModal(route);
      } else {
        if (timer) clearTimeout(timer);
        timer = setTimeout(reset, winMs);
      }
    }, { passive:false });
  }

  bindSecretTaps($("secretRight"), "#/dashboard"); // правая — кухня
  bindSecretTaps($("secretLeft"),  "#/board");     // левая — табло зала

  /* =========================================================
     КНОПКИ
     ========================================================= */

  $("cartButton").onclick = openCart;
  $("closeCart").onclick = closeCart;
  $("editCart").onclick = () => { closeCart(); };
  $("confirmCart").onclick = showPayChoice;

  /* =========================================================
     СТАРТ
     ========================================================= */

  renderCategories();
  renderProducts();
  updateCartButton();

  </script>

    <script>
  /* =========================================================
     ТАБЛО КУХНИ (#/dashboard)
     ========================================================= */

  function renderDashboard() {
    const root = document.getElementById("app");
    root.innerHTML = "";

    const dash = loadDash();

    const wrap = document.createElement("div");
    wrap.style.padding = "20px";

    const title = document.createElement("h2");
    title.textContent = "КУХНЯ — Заказы";
    title.style.fontSize = "36px";
    wrap.appendChild(title);

    if (!dash.length){
      const empty = document.createElement("p");
      empty.textContent = "Пока заказов нет";
      empty.style.fontSize = "28px";
      wrap.appendChild(empty);
    } else {
      dash.forEach(order => {
        const box = document.createElement("div");
        box.style.padding = "12px 20px";
        box.style.margin = "10px 0";
        box.style.background = "#fff";
        box.style.borderRadius = "12px";
        box.style.boxShadow = "0 0 4px rgba(0,0,0,0.2)";
        box.style.fontSize = "26px";

        const head = document.createElement("div");
        head.style.fontWeight = "bold";
        head.textContent = "№ " + order.id + " — " + order.status;
        box.appendChild(head);

        order.items.forEach(i => {
          const row = document.createElement("div");
          row.textContent = i.name + " × " + i.qty;
          row.style.marginLeft = "10px";
          row.style.marginTop = "4px";
          box.appendChild(row);
        });

        const btns = document.createElement("div");
        btns.style.marginTop = "10px";

        const btnReady = document.createElement("button");
        btnReady.className = "btn btn-primary";
        btnReady.style.marginRight = "12px";
        btnReady.textContent = "ГОТОВО";

        btnReady.onclick = () => setKitchenStatus(order.id, "готов");

        const btnRemove = document.createElement("button");
        btnRemove.className = "btn btn-secondary";
        btnRemove.textContent = "УДАЛИТЬ";

        btnRemove.onclick = () => {
          const arr = loadDash().filter(o => o.id !== order.id);
          saveDash(arr);
          renderDashboard();
        };

        btns.appendChild(btnReady);
        btns.appendChild(btnRemove);
        box.appendChild(btns);

        wrap.appendChild(box);
      });
    }

    // кнопка "выйти"
    const exitBtn = document.createElement("div");
    exitBtn.textContent = "Выйти";
    exitBtn.style.position = "fixed";
    exitBtn.style.bottom = "40px";
    exitBtn.style.right = "40px";
    exitBtn.style.fontSize = "28px";
    exitBtn.style.color = "#fff";
    exitBtn.style.background = "#555";
    exitBtn.style.padding = "12px 16px";
    exitBtn.style.borderRadius = "10px";
    exitBtn.style.cursor = "pointer";
    exitBtn.onclick = () => {
      sessionStorage.removeItem(PIN_OK_KEY);
      location.hash = "/";
    };
    wrap.appendChild(exitBtn);

    root.appendChild(wrap);
  }

  function setKitchenStatus(id, status){
    const dash = loadDash();
    const o = dash.find(x => x.id === id);
    if (!o) return;

    o.status = status;

    saveDash(dash);
    renderDashboard();
  }


  /* =========================================================
     ТАБЛО ЗАЛА (#/board)
     ========================================================= */

  function renderBoard() {
    const root = document.getElementById("app");
    root.innerHTML = "";

/* =========================================================

   ВСТАВИТЬ ПОСЛЕ ЧАСТЬ 3
   ========================================================= */

/* ===== PIN настройки ===== */
const PIN_CODE = "65Vafuza";                // твой PIN
const PIN_OK_KEY = "PIN_OK_KEY";           // sessionStorage
const WANT_ROUTE_KEY = "WANT_ROUTE_KEY";   // sessionStorage

/* ===== QR URL для СБП (картинка) =====
   Ты потом просто в консоли или кодом сделаешь:
   localStorage.setItem('sbp_qr_url_v1', 'https://....png')
*/
const SBP_QR_URL_KEY = "sbp_qr_url_v1";

function getSbpQrUrl(){
  const fromLs = (localStorage.getItem(SBP_QR_URL_KEY) || "").trim();
  if (fromLs) return fromLs;

  const cfg = loadConfig?.() || {};
  return (cfg.sbpQrUrl || "").trim();
}

/* =========================================================
   QR МОДАЛКА (КАРТИНКА)
   ========================================================= */
function ensureQrModal(){
  let m = document.getElementById("qrModal");
  if (m) return m;

  m = el(`
    <div id="qrModal" class="modal">
      <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-xl text-center">

/* =========================================================
   ПЕРЕОПРЕДЕЛЯЕМ ОК в payModal:
   после создания заказа → показываем QR картинку
   ========================================================= */
(function patchPayModalOk(){
  const okBtn = document.getElementById("payOk");
  if (!okBtn) return;

  // снимаем старый если был
  if (okBtn._patchedHandler){
    okBtn.removeEventListener("click", okBtn._patchedHandler);
  }

  okBtn._patchedHandler = async (e) => {
    e?.preventDefault(); e?.stopPropagation();

    const payModal = document.getElementById("payModal");
    const closePay = () => payModal?.classList.remove("open");

    // собрать товары
    const cfg = loadConfig();
    const counts = window.__orderCounts || {};
    const itemsSel = [];
    let total = 0;

    cfg.menu.forEach(cat =>
      cat.items.forEach(it => {
        const q = counts[it.name] || 0;
        if (q > 0){
          itemsSel.push({ name: it.name, qty: q, price: it.price || 0 });
          total += q * (it.price || 0);

      })

    if (!itemsSel.length){
      closePay();
      return;

    let order;
    try{
      const res = await rpc({
        op: "create",
        data: {
          clientId: "terminal",
          items: itemsSel,
          total,
          pay: "sbp",
          status: "готовится"
        }
      });

      order = res?.order || {
        id: Date.now().toString().slice(-6),
        createdAt: Date.now(),
        items: itemsSel,
        total,
        pay: "sbp",
        status: "готовится"

/* =========================================================
   2 СКРЫТЫЕ ЗОНЫ НА ТЕРМИНАЛЕ (8 тапов)
    - справа снизу → #/dashboard (кухня)
    - слева снизу  → #/board (табло зала)
   ========================================================= */
function ensureHotZones(){
  // правая зона
  let right = document.getElementById("hotZoneRight");
  if (!right){
    right = document.createElement("div");
    right.id = "hotZoneRight";
    right.style.cssText = `
      position:fixed; right:0; bottom:0;
      width:220px; height:160px; z-index:9998; opacity:0;
    `;
    document.body.appendChild(right);
  }

  // левая зона
  let left = document.getElementById("hotZoneLeft");
  if (!left){
    left = document.createElement("div");
    left.id = "hotZoneLeft";
    left.style.cssText = `
      position:fixed; left:0; bottom:0;
      width:220px; height:160px; z-index:9998; opacity:0;
    `;
    document.body.appendChild(left);
  }

  bindMultiTap(right, 8, () => askPinThenGo("#/dashboard"));
  bindMultiTap(left, 8, () => askPinThenGo("#/board"));
}

function bindMultiTap(node, count, onDone){
  if (!node || node._bound) return;
  node._bound = true;

  let taps=0, first=0, timer=null;
  const windowMs=1300;

  function reset(){
    taps=0; first=0;
    if (timer){ clearTimeout(timer); timer=null; }
  }

  function handler(){
    const now = Date.now();
    if(!first) first=now;
    taps++;

    if(now-first > windowMs){
      reset(); taps=1; first=now;
    }

    if(taps>=count){
      reset();
      onDone();
    } else {
      if(timer) clearTimeout(timer);
      timer=setTimeout(reset, windowMs);
    }
  }

  ["click","pointerup","touchend"].forEach(ev=>{
    node.addEventListener(ev, (e)=>{
      e.preventDefault(); e.stopPropagation();
      handler();
    }, {passive:false});
  });
}


/* =========================================================
   PIN МОДАЛКА ЛОГИКА
   ========================================================= */
function askPinThenGo(routeHash){
  sessionStorage.setItem(WANT_ROUTE_KEY, routeHash);
  document.getElementById("pinInput").value = "";
  document.getElementById("pinModal").classList.add("open");
}

(function bindPinModal(){
  const pinM = document.getElementById("pinModal");
  const pinOk = document.getElementById("pinOk");
  const pinCancel = document.getElementById("pinCancel");
  const pinInput = document.getElementById("pinInput");

  if (!pinM || pinM._bound) return;
  pinM._bound = true;

  pinOk.onclick = (e)=>{
    e?.preventDefault(); e?.stopPropagation();

    const val = (pinInput.value||"").trim();
    if (!val){
      showToast("Введите ключ");
      return;
    }
    if (val !== PIN_CODE){
      showToast("Неверный ключ");
      return;
    }

    pinM.classList.remove("open");
    sessionStorage.setItem(PIN_OK_KEY, "1");

    const want = sessionStorage.getItem(WANT_ROUTE_KEY) || "#/dashboard";
    sessionStorage.removeItem(WANT_ROUTE_KEY);
    location.hash = want;
  };

  pinCancel.onclick = ()=>{
    pinM.classList.remove("open");
    sessionStorage.removeItem(WANT_ROUTE_KEY);
  };

  pinM.onclick = (e)=>{
    if(e.target===pinM) pinCancel.onclick();
  };
})();


/* =========================================================
   ПЕРЕОПРЕДЕЛЯЕМ renderBoard:

  } else {

  bindMultiTap(exitHot, 8, ()=>{

/* =========================================================
   РОУТЕР (ПЕРЕОПРЕДЕЛЯЕМ)
   ========================================================= */
function router(){
  const route = location.hash.replace("#","");

  // терминал всегда доступен
  if (route === "/" || route === "" || route === "order"){
    renderCategories();
    renderProducts();
    updateCartButton();
    ensureHotZones();
    return;
  }

  // кухня и табло зала — только через PIN
  const pinOk = sessionStorage.getItem(PIN_OK_KEY) === "1";
  if (!pinOk){
    // если кто-то руками ввёл hash — просим PIN и возвращаем на терминал
    askPinThenGo("#/"+route);
    location.hash = "/";
    return;
  }

  if (route === "dashboard"){
    renderDashboard();
    return;
  }

  if (route === "board"){
    renderBoard();
    return;
  }

  // fallback
  location.hash = "/";
}

window.addEventListener("hashchange", router);
router();
ensureHotZones();

<script>
/* =========================================================
   ЧАСТЬ 6 — RPC ФОЛБЭК + ЛОКАЛЬНЫЙ API-МОК
   ========================================================= */

/*
  Когда будет готов реальный Yandex API:
  1) поставишь USE_LOCAL_API = false
  2) и всё продолжит работать через сеть
*/
const USE_LOCAL_API = true;

// ключ “облачных” заказов (локально)
const CLOUD_ORDERS_KEY = "cloud_orders_v1";

// ключ “облачного” конфига
const CLOUD_CONFIG_KEY = "cloud_config_v1";

// простая утилита
function _lsGet(key, fallback){
  try {
    const v = JSON.parse(localStorage.getItem(key) || "null");
    return v == null ? fallback : v;
  } catch { return fallback; }
}
function _lsSet(key, val){
  localStorage.setItem(key, JSON.stringify(val));
}

/* ========= локальная реализация op ========= */
async function localRpc(payload){
  const op = payload?.op;
  if (!op) return { error:"no-op" };

  // заказы в “облаке”
  let orders = _lsGet(CLOUD_ORDERS_KEY, []);

  // конфиг меню в “облаке”
  let cloudCfg = _lsGet(CLOUD_CONFIG_KEY, null);

  // helper: нормализуем заказ
  function normalizeOrder(o){
    const id = o.id || (Date.now().toString().slice(-6));
    return {
      id,
      createdAt: o.createdAt || Date.now(),
      items: Array.isArray(o.items) ? o.items : [],
      total: typeof o.total === "number" ? o.total : 0,
      status: o.status || "готовится",
      pay: o.pay || "sbp"
    };
  }

  /* ------- ops ------- */
  switch(op){

    case "create":{
      // ожидаем payload.data.items / payload.items
      const data = payload.data || payload;
      const order = normalizeOrder({
        items: data.items || [],
        total: data.total || 0,
        pay: data.pay || "sbp",
        status: data.status || "готовится"
      });

      orders.unshift(order);
      orders = orders.slice(0, 500);
      _lsSet(CLOUD_ORDERS_KEY, orders);

      return { ok:true, order };
    }

    case "list":{
      return { ok:true, orders };
    }

    case "update":{
      const id = String(payload.id);
      const patch = payload.patch || {};
      orders = orders.map(o => {
        if (String(o.id) !== id) return o;
        return { ...o, ...patch };
      });
      _lsSet(CLOUD_ORDERS_KEY, orders);
      return { ok:true };
    }

    case "delete":{
      const id = String(payload.id);
      orders = orders.filter(o => String(o.id) !== id);
      _lsSet(CLOUD_ORDERS_KEY, orders);
      return { ok:true };
    }

    case "clear":{
      orders = [];
      _lsSet(CLOUD_ORDERS_KEY, orders);
      return { ok:true };
    }

    case "config_get":{
      // если в “облаке” нет конфига — отдаём локальный
      if (!cloudCfg){
        cloudCfg = loadConfig();
        _lsSet(CLOUD_CONFIG_KEY, cloudCfg);
      }
      return { ok:true, config: cloudCfg };
    }

    case "config_set":{
      const cfg = payload.config;
      if (cfg && cfg.menu){
        _lsSet(CLOUD_CONFIG_KEY, cfg);
      }
      return { ok:true };
    }

    default:
      return { error:"unknown-op", op };
  }
}


/* ========= новая rpc с фолбэком ========= */
window.rpc = async function rpcSmart(payload){
  // если принудительно локально
  if (USE_LOCAL_API){
    return localRpc(payload);
  }

  // иначе сначала сеть
  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify(payload || {})
    });

    if(!res.ok){
      throw new Error("net-fail");
    }

    return await res.json();

  }catch(e){
    console.warn("RPC network failed → fallback to local", e);
    return localRpc(payload);
  }
};
