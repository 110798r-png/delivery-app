function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function initPushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    } catch (e) { console.warn('Push subscribe error', e); return; }
  }
  try {
    await rpc({ op: 'push_subscribe', clientId: getClientId(), subscription: sub });
  } catch (e) { console.warn('push_subscribe RPC error', e); }
}

async function rpc(payload){
  if (!API_URL) throw new Error('API_URL empty');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'content-type':'application/json' },
    body: JSON.stringify(payload || {})
  });
  if (!res.ok) {
    const t = await res.text().catch(() => res.statusText);
    throw new Error(`RPC ${res.status}: ${t}`);
  }
  return res.json();
}

function bindHeaderDots(){
  const termDot = document.getElementById('termDot');
  const dashDot = document.getElementById('dashDot');
  if(!termDot || !dashDot || termDot._bound) return;
  termDot._bound = dashDot._bound = true;

  function makeTapHandler(onDone, tapsRequired=4){
    let taps=0, first=0, timer=null;
    const windowMs=1500;
    const reset=()=>{ taps=0; first=0; if(timer){clearTimeout(timer); timer=null;} };
    return ()=>{
      const now=Date.now();
      if(!first) first=now;
      taps++;
      if(now-first>windowMs){ reset(); taps=1; first=now; }
      if(taps>=tapsRequired){ reset(); onDone(); }
      else {
        if(timer) clearTimeout(timer);
        timer=setTimeout(reset, windowMs);
      }
    };
  }

  const goDash = ()=>{
    if(sessionStorage.getItem(TABLO_PIN_OK)==='1'){
      location.hash = '#/dashboard';
    } else {
      sessionStorage.setItem(WANT_DASH,'1');
      document.getElementById('pinModal')?.classList.add('open');
    }
  };

  const goTerm = ()=>{
    if(sessionStorage.getItem(TABLO_PIN_OK)==='1'){
      location.hash = '#/terminal';
    } else {
      sessionStorage.setItem(WANT_TERM,'1');
      document.getElementById('pinModal')?.classList.add('open');
    }
  };

  const onTermTap = makeTapHandler(goTerm, 4);
  const onDashTap = makeTapHandler(goDash, 4);

  ['click','pointerup','touchend'].forEach(ev=>{
    termDot.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); onTermTap(); }, {passive:false});
    dashDot.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); onDashTap(); }, {passive:false});
  });

function safeParse(k, f){
  try{
    const v=JSON.parse(localStorage.getItem(k)||'null');
    if(v==null) return f;
    if(Array.isArray(f)) return Array.isArray(v)?v:[];
    if(typeof f==='object') return v&&typeof v==='object'?v:{};
    return v;
  }catch{ return f }
}

function getClientId(){
  let id = localStorage.getItem(CLIENT_ID_KEY);
  if (id) return id;
  const p = loadProfile();
  if (p && p.phone) id = 'tel:' + p.phone.replace(/\s+/g,'');
  else id = 'guest-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
  localStorage.setItem(CLIENT_ID_KEY, id);
  return id;
}

    }

  return null;
}

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2 }
function animateScrollX(el, to, {duration=280, onEnd}={}){
  const from=el.scrollLeft; const diff=to-from;
  if(!diff){ onEnd&&onEnd(); return; }
  const start=performance.now();
  function step(ts){
    const t=Math.min(1,(ts-start)/duration);
    el.scrollLeft=from+diff*easeInOutCubic(t);
    if(t<1) requestAnimationFrame(step); else onEnd&&onEnd();
  }
  requestAnimationFrame(step);
}

function syncOrderStatus(id, status){
  let hist = loadHistory(); let changed = false;
  for (let i=0;i<hist.length;i++){
    if (String(hist[i].id) === String(id)){
      if (hist[i].status !== status){ hist[i] = { ...hist[i], status }; changed = true; }
      break;
    }
  }
  if (changed){ saveHistory(hist); window.dispatchEvent(new CustomEvent('orders:history-updated')); }
}

async function pullAndMergeStatuses(){
  try{
    const cloud = await rpc({ op:'list' });
    if(!cloud || !Array.isArray(cloud.orders)) return;
    const byId = new Map(cloud.orders.map(o => [String(o.id), o]));
    const hist = loadHistory();
    let changed = false;

    for (let i=0;i<hist.length;i++){
      const id = String(hist[i].id);
      const fromCloud = byId.get(id);
      if (!fromCloud) continue;
      const next = { ...hist[i], status: fromCloud.status, etaMinutes: fromCloud.etaMinutes, etaUntil: fromCloud.etaUntil };
      if (JSON.stringify(next) !== JSON.stringify(hist[i])) { hist[i]=next; changed=true; }
    }
    if(changed){
      saveHistory(hist);
      window.dispatchEvent(new CustomEvent('orders:history-updated'));
    }
  }catch(e){ console.warn('pullAndMergeStatuses error', e); }
}

  if(!left || !right || left._bound) return;
  left._bound = right._bound = true;

  function makeTapHandler(onDone){
    let taps=0, first=0, timer=null;
    const windowMs=1500;
    const reset=()=>{ taps=0; first=0; if(timer){ clearTimeout(timer); timer=null; } };
    return function(){
      const now=Date.now();
      if(!first) first=now;
      taps++;
      if(now-first>windowMs){ reset(); taps=1; first=now; }
      if(taps>=8){ reset(); onDone(); }
      else { if(timer) clearTimeout(timer); timer=setTimeout(reset, windowMs); }
    };
  }

  const goDash = makeTapHandler(()=>{
    if(sessionStorage.getItem(TABLO_PIN_OK)==='1') location.hash='#/dashboard';
    else { sessionStorage.setItem(WANT_DASH,'1'); document.getElementById('pinModal')?.classList.add('open'); }

    else { sessionStorage.setItem(WANT_TERM,'1'); document.getElementById('pinModal')?.classList.add('open'); }
  });

  ['click','pointerup','touchend'].forEach(ev=>{
    left.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); goTerm(); }, {passive:false});
    right.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); goDash(); }, {passive:false});

  const escAttr = (val) => (window.CSS && typeof CSS.escape === 'function')
    ? CSS.escape(val)
    : String(val).replace(/"/g, '\\"');

  const root = el(`
    <div class="relative">
      <section class="sticky-top mb-2">
        <div class="glass-panel rounded-2xl px-3 py-3">
          <div id="categoryBar" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
        </div>
      </section>

      <section>
        <div id="catPager" class="no-scrollbar"></div>
      </section>

      <div id="confirmBar" class="confirm-bar">
        <div class="flex items-center justify-between gap-3">
          <div class="text-base">
            <span class="text-gray-600">Итого:</span>
            <b id="totalVal">0 руб.</b>
          </div>
          <button id="confirmBtn"
            class="px-4 py-2 rounded-xl bg-black text-white flex-1 disabled:opacity-40 disabled:cursor-not-allowed"
            disabled>
            Оформить заказ
          </button>
        </div>
      </div>
  `);

  const categoryBar = root.querySelector('#categoryBar');
  const catPager    = root.querySelector('#catPager');
  const totalEl     = root.querySelector('#totalVal');
  const confirmBtn  = root.querySelector('#confirmBtn');

  setBodyScrollLock(true);
  confirmBtn._busy = false;

  let activeIdx   = 0;
  let isAnimating = false;
  const scrollMemory = new Map();
  const panelW = () => catPager.getBoundingClientRect().width || 1;

  function applyRepeatOrder(){
    const raw = sessionStorage.getItem('repeat_order_items');
    if (!raw) return;
    sessionStorage.removeItem('repeat_order_items');
    const autoPay = sessionStorage.getItem('open_pay_after_repeat') === '1';
    sessionStorage.removeItem('open_pay_after_repeat');

    let items = [];
    try { items = JSON.parse(raw) || []; } catch {}
    if (!Array.isArray(items) || !items.length) return;

    window.__orderCounts = window.__orderCounts || {};
    const cfg = loadConfig();
    const namesSet = new Set(cfg.menu.flatMap(cat => cat.items.map(it => it.name)));

    items.forEach(it => {
      if (!namesSet.has(it.name)) return;
      const q = Number(it.qty || it.count || 0);
      if (q > 0) window.__orderCounts[it.name] = q;
    });

    catPager.querySelectorAll('[data-q]').forEach(node => {
      const name = node.getAttribute('data-q');
      node.textContent = String(window.__orderCounts[name] || 0);
    });

    recalcTotal();
    if (autoPay && !confirmBtn.disabled){
      setTimeout(() => !confirmBtn.disabled && confirmBtn.click(), 50);
    }
  }

  loadConfig().menu.forEach((cat, idx) => {
    categoryBar.appendChild(el(`
      <button type="button"
        class="px-3 py-1.5 rounded-full border text-sm whitespace-nowrap ${idx === 0 ? 'bg-black text-white border-black' : 'bg-white/50'}"
        data-idx="${idx}">
        ${cat.title}
      </button>
    `));
  });

  function highlightChip(idx){
    const buttons = categoryBar.querySelectorAll('button');
    buttons.forEach((b, i) => {
      const on = i === idx;
      b.classList.toggle('bg-black', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('border-black', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
  }

  function goToIndex(idx, { animate = true } = {}){
    const cfg = loadConfig();
    idx = Math.max(0, Math.min(cfg.menu.length - 1, idx));
    const target = Math.round(panelW() * idx);
    highlightChip(idx);

    const box = catPager.children[idx]?.querySelector('.v-scroll');

    if (!animate){
      const old = catPager.children[activeIdx]?.querySelector('.v-scroll');
      if (old) scrollMemory.set(cfg.menu[activeIdx].key, old.scrollTop);
      catPager.scrollLeft = target;
      if (box) box.scrollTop = scrollMemory.get(cfg.menu[idx].key) || 0;
      activeIdx = idx;
      return;
    }

    isAnimating = true;
    const prevSnap = catPager.style.scrollSnapType;
    catPager.style.scrollSnapType = 'none';

    const old = catPager.children[activeIdx]?.querySelector('.v-scroll');
    if (old) scrollMemory.set(cfg.menu[activeIdx].key, old.scrollTop);

    animateScrollX(catPager, target, {
      duration: 280,
      onEnd(){
        const cfg2 = loadConfig();
        const box2 = catPager.children[idx]?.querySelector('.v-scroll');
        if (box2) box2.scrollTop = scrollMemory.get(cfg2.menu[idx].key) || 0;
        activeIdx = idx;
        isAnimating = false;
        catPager.style.scrollSnapType = prevSnap || 'x mandatory';
      }
    });
  }

  categoryBar.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-idx]');
    if (!b || isAnimating) return;
    goToIndex(+b.dataset.idx, { animate: true });
  });

  function rebuildMenu(){
    catPager.innerHTML = '';
    const cfg = loadConfig();

    cfg.menu.forEach((cat) => {
      const panel = el(`<div class="cat-panel"></div>`);
      const vbox  = el(`<div class="v-scroll px-0.5"></div>`);
      const list  = el(`<div class="grid gap-3"></div>`);

      cat.items.forEach(it => {
        const q = (window.__orderCounts?.[it.name] || 0);
        const row = el(`
          <div class="menu-card">
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm flex items-center gap-2">${it.name}</div>
              ${cfg.theme.showPrice ? `<div class="text-xs text-gray-500 mt-1">${money(it.price || 0)}</div>` : ''}
              <div class="flex items-center gap-3 mt-3">
                <button type="button" class="w-8 h-8 rounded-xl border" data-name="${it.name}" data-act="dec">−</button>
                <div class="w-6 text-center text-sm" data-q="${it.name}">${q}</div>
                <button type="button" class="w-8 h-8 rounded-xl bg-black text-white" data-name="${it.name}" data-act="inc">+</button>
              </div>
            </div>
            <img src="${it.img || 'https://placehold.co/110x70?text=food'}" class="menu-card-img" alt="">
          </div>
        `);
        list.appendChild(row);
      });

      list.appendChild(el(`<div class="h-24"></div>`));
      vbox.appendChild(list);
      panel.appendChild(vbox);
      catPager.appendChild(panel);

      let down=false, used=false, sx=0, sy=0, locked=null;
      const PIX_LOCK=10;
      const THRESH = () => Math.max(40, (catPager.getBoundingClientRect().width || 1) * 0.25);

      function onPointerDown(e){
        if (e.pointerType !== 'touch' || isAnimating) return;
        down=true; used=false; sx=e.clientX; sy=e.clientY; locked=null;
        vbox.setPointerCapture?.(e.pointerId);
      }
      function onPointerMove(e){
        if (e.pointerType !== 'touch' || !down || used || isAnimating) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        if (locked===null){
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > PIX_LOCK) locked='x';
          else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > PIX_LOCK) locked='y';
        }
        if (locked==='x'){
          e.preventDefault();
          if (Math.abs(dx) >= THRESH()){
            used=true;
            const next = dx < 0 ? activeIdx + 1 : activeIdx - 1;
            goToIndex(next, { animate:true });
          }
        }
      }
      function onPointerUp(){ down=false; used=false; locked=null; }

      vbox.addEventListener('pointerdown', onPointerDown, { passive:true });
      vbox.addEventListener('pointermove', onPointerMove, { passive:false });
      ['pointerup','pointercancel','pointerleave'].forEach(evt => vbox.addEventListener(evt, onPointerUp));
    });
  }

  catPager.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;

    const name  = btn.dataset.name;
    const delta = btn.dataset.act === 'inc' ? 1 : -1;
    const selector = `[data-q="${escAttr(name)}"]`;

    const cur = parseInt(catPager.querySelector(selector)?.textContent || '0', 10) || 0;
    const next = Math.max(0, cur + delta);

    catPager.querySelectorAll(selector).forEach(n => n.textContent = String(next));
    window.__orderCounts = window.__orderCounts || {};
    window.__orderCounts[name] = next;
    recalcTotal();
  });

  function applyHeights(){
    try {
      const headerH  = document.querySelector('.brand-strip')?.getBoundingClientRect().height || 0;
      const chipsH   = root.querySelector('.sticky-top')?.getBoundingClientRect().height || 0;
      const confirmH = root.querySelector('#confirmBar')?.getBoundingClientRect().height || 0;
      const availH   = Math.max(240, window.innerHeight - headerH - chipsH - confirmH - 8);

      const first  = root.querySelector('.menu-card');
      const cardH  = first ? Math.ceil(first.getBoundingClientRect().height) : 104;
      const h      = Math.min(availH, cardH * 4 + 12 * 3 + 4);

      root.querySelectorAll('.v-scroll').forEach(el => el.style.height = h + 'px');
      goToIndex(activeIdx, { animate:false });
    } catch {}
  }
  window.addEventListener('resize', applyHeights);

  catPager.addEventListener('scroll', () => {
    if (isAnimating) return;
    if (catPager._scrollTimer) clearTimeout(catPager._scrollTimer);
    catPager._scrollTimer = setTimeout(() => {
      const idx = Math.round(catPager.scrollLeft / (catPager.getBoundingClientRect().width || 1));
      if (idx !== activeIdx){ highlightChip(idx); activeIdx = idx; }
    }, 80);
  });

  function recalcTotal(){
    const cfg = loadConfig();
    const counts = window.__orderCounts || {};
    let sum=0;
    cfg.menu.forEach(cat => cat.items.forEach(it => { sum += (counts[it.name]||0)*(it.price||0); }));
    totalEl.textContent = money(sum);
    confirmBtn.disabled = sum <= 0;
    return sum;
  }

  confirmBtn.addEventListener('click', () => {
    const cfg = loadConfig();
    const counts = window.__orderCounts || {};
    const items=[];
    cfg.menu.forEach(cat => cat.items.forEach(it=>{
      const q=counts[it.name]||0;
      if(q>0) items.push({name:it.name, qty:q, price:it.price||0});
    }));
    if(!items.length || confirmBtn._busy) return;

    confirmBtn._busy=true;
    confirmBtn.disabled=true;

    const sumBox=document.getElementById('paySummary');
    let total=0;
    sumBox.innerHTML = items.map(i=>{
      total += i.qty*(i.price||0);
      return `<div class="flex items-center justify-between">
                <div class="truncate">${i.name} ×${i.qty}</div>
                <div class="ml-2 whitespace-nowrap">${money(i.qty*(i.price||0))}</div>
              </div>`;
    }).join('');
    sumBox.insertAdjacentHTML('beforeend',
      `<div class="mt-2 pt-2 border-t flex items-center justify-between font-semibold">
         <div>Итого</div><div>${money(total)}</div>
       </div>`);
    const prof=loadProfile();
    const sel=document.getElementById('paySelect');
    sel.value=prof.paymentMethod||'cash';
    document.getElementById('payModal').classList.add('open');
  });

  function resetCounts(){
    window.__orderCounts={};
    catPager.querySelectorAll('[data-q]').forEach(n=>n.textContent='0');
    totalEl.textContent=money(0);
    confirmBtn.disabled=true;
  }

  (function bindPayModal(){
    const m=document.getElementById('payModal');
    const ok=document.getElementById('payOk');
    const cancel=document.getElementById('payCancel');
    const sel=document.getElementById('paySelect');

    const close=()=>m.classList.remove('open');
    const finalize=()=>{ confirmBtn._busy=false; confirmBtn.disabled=false; };

    const onCancel=(e)=>{ e&&e.preventDefault(); e&&e.stopPropagation(); close(); finalize(); };

    const onOk=async (e)=>{
      e&&e.preventDefault(); e&&e.stopPropagation();
      const cfg=loadConfig();
      const counts=window.__orderCounts||{};
      const itemsSel=[];
      let total=0;

      cfg.menu.forEach(cat=>cat.items.forEach(it=>{
        const q=counts[it.name]||0;
        if(q>0){ itemsSel.push({name:it.name, qty:q, price:it.price||0}); total += q*(it.price||0); }
      }));
      if(!itemsSel.length){ close(); finalize(); return; }

      try{
        const res=await rpc({ op:'create', data:{ clientId:getClientId(), items:itemsSel, total, pay:sel.value||'cash' } });
        const order = res?.order || { id:Date.now().toString().slice(-6), createdAt:Date.now(), items:itemsSel, total, pay:sel.value||'cash', status:'готовится' };

        const history=loadHistory(); history.unshift(order); saveHistory(history.slice(0,50));
        const dash=loadDash(); dash.unshift(order); saveDash(dash.slice(0,200));

        const p=loadProfile(); p.paymentMethod=sel.value||'cash'; saveProfile(p);
      }catch(err){
        console.warn('RPC create error', err);
        showToast('Не удалось отправить заказ, попробуйте ещё раз.');
        finalize(); return;
      }

      close(); finalize(); resetCounts();
      window.dispatchEvent(new CustomEvent('orders:history-updated'));
    };

    ok.onclick=onOk;
    cancel.onclick=onCancel;
    m.onclick=(e)=>{ if(e.target===m) onCancel(e); };
  })();

  rebuildMenu();
  bindSecretZones();
  requestAnimationFrame(()=>{
    highlightChip(0);
    goToIndex(0,{animate:false});
    recalcTotal();
    applyHeights();
    applyRepeatOrder();
  });

  const syncTimer=setInterval(async ()=>{
    try{
      const cfgRemote=await fetchRemoteConfig();
      if(cfgRemote){
        const v=calcConfigVersion(cfgRemote);
        if(v!==lastConfigVersion){
          lastConfigVersion=v;
          rebuildMenu();
          recalcTotal();
          applyHeights();
        }
      }
    }catch{}
    await pullAndMergeStatuses().catch(()=>{});
  },4000);

  root.cleanup=()=>{
    setBodyScrollLock(false);
    clearInterval(syncTimer);
    window.removeEventListener('resize', applyHeights);
  };

  return root;
}

/* ===== Dashboard / Terminal / Builder / Router — без изменений, как у тебя ===== */

function DashboardView(){
  const root = el(`
    <div class="grid gap-4 max-w-6xl pb-24">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <h2 class="text-xl font-semibold">Текущие заказы</h2>
          <button id="soundToggle" class="px-3 py-1.5 rounded-xl border bg-white" title="Звук уведомлений">🔔 Звук</button>
        </div>
        <div class="flex items-center gap-2">
          <a href="#/builder" class="px-3 py-2 rounded-xl border bg-white" title="Конструктор">Конструктор</a>
          <button id="btnClearAll" class="px-3 py-2 rounded-xl border bg-red-50 text-red-700">Очистить всё</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3" id="list"></div>

      <div>
        <button class="px-3 py-2 rounded-xl border" onclick="location.hash='#/order'">Назад</button>
      </div>
    </div>
  `);

  const list = root.querySelector('#list');
  let dashOrders = loadDash();
  let knownIds = new Set(dashOrders.map(o => String(o.id)));
  const ding = document.getElementById('orderDing');
  const soundBtn = root.querySelector('#soundToggle');
  let hiddenNewCount=0;
  let pollTimer=null;

  const soundOn  = () => localStorage.getItem(SOUND_ON_KEY) === '1';
  const setSound = (on) => {
    localStorage.setItem(SOUND_ON_KEY, on ? '1' : '0');
    soundBtn.classList.toggle('bg-green-50', on);
    soundBtn.classList.toggle('border-green-600', on);
  };
  setSound(soundOn());
  soundBtn.onclick = () => setSound(!soundOn());

  function handleVisibilityChange(){
    if (document.visibilityState === 'visible' && hiddenNewCount > 0){
      showToast(`Новых заказов: ${hiddenNewCount}`);
      hiddenNewCount=0;
    }
  }
  document.addEventListener('visibilitychange', handleVisibilityChange);

  function orderCard(o){
    const clientTotal = (o.items || []).reduce((s, i) => s + (i.price || 0) * (i.qty || 0), 0);
    const total   = Math.max(typeof o.total === 'number' ? o.total : 0, clientTotal);
    const created = o.createdAt ? new Date(o.createdAt) : new Date();

    const colorMap = {
      'готовится': 'bg-blue-50 border-blue-300',
      'готово':    'bg-green-50 border-green-300',
      'готов':     'bg-green-50 border-green-300',
      'новый':     'bg-blue-50 border-blue-300'
    };
    const statusColor = colorMap[o.status] || 'bg-white border-gray-200';

    const itemsHtml = (o.items || []).map(i => `
      <div class="flex justify-between text-lg">
        <div>${i.name}</div>
        <div class="font-semibold">${i.qty} × ${i.price}</div>
      </div>`).join('');

    const etaBlock = o.etaUntil
      ? `<div class="text-sm text-gray-700 mt-1">
           Готово примерно в ${new Date(o.etaUntil).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
         </div>`
      : '';

    const card = el(`
      <div class="p-6 rounded-3xl border-2 ${statusColor} shadow-sm flex flex-col gap-3" data-id="${o.id}">
        <div class="flex items-center justify-between">
          <div class="text-2xl font-extrabold tracking-tight">#${o.id || '—'}</div>
          <span class="px-3 py-1 rounded-full text-sm font-medium border bg-white/50">${o.status || 'готовится'}</span>
        </div>
        <div class="text-gray-600 text-sm">${created.toLocaleString()}</div>
        ${etaBlock}
        <div class="mt-2 grid gap-1 text-lg">${itemsHtml || '—'}</div>
        <div class="mt-3 flex items-center justify-between text-xl font-bold">
          <div>Итого:</div><div>${total} ₽</div>
        </div>
        <div class="mt-2 flex flex-wrap gap-2 items-center">
          <label class="text-sm">Статус:</label>
          <select class="border rounded-xl p-2 text-sm" data-k="status">
            ${['готовится','готово'].map(s=>`<option ${s===(o.status||'готовится')?'selected':''}>${s}</option>`).join('')}
          </select>
          <label class="text-sm ml-2">Время:</label>
          <select class="border rounded-xl p-2 text-sm" data-k="eta">
            <option value="">—</option>
            ${[5,10,15,20,25,30].map(m=>`<option value="${m}" ${Number(o.etaMinutes)===m?'selected':''}>${m} мин</option>`).join('')}
          </select>
          <button type="button" class="px-3 py-2 rounded-xl border bg-white" data-act="save">Сохранить</button>
          <button type="button" class="px-3 py-2 rounded-xl border bg-red-50 text-red-600 ml-auto" data-act="delete">Удалить</button>
        </div>
      </div>
    `);

    card.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-act]');
      if(!btn) return;
      const act=btn.dataset.act;

      if(act==='save'){
        const status=card.querySelector('[data-k="status"]').value;
        const etaSel=card.querySelector('[data-k="eta"]').value;
        const etaMinutes=etaSel?Number(etaSel):null;

        const patch={status};
        if(etaMinutes){
          patch.etaMinutes=etaMinutes;
          patch.etaUntil=Date.now()+etaMinutes*60*1000;
        }else{
          patch.etaMinutes=null; patch.etaUntil=null;
        }

        const i=dashOrders.findIndex(x=>String(x.id)===String(o.id));
        if(i>=0){
          dashOrders[i]={...dashOrders[i], ...patch};
          saveDash(dashOrders);
          syncOrderStatus(o.id, patch.status);
          showToast(`Статус #${o.id} обновлён`);
          renderOrders();
        }
        try{ rpc({op:'update', id:o.id, patch}).catch(()=>{});}catch{}
      }

      if(act==='delete'){
        if(!card.dataset.confirm){
          card.dataset.confirm='1';
          btn.textContent='Точно удалить?';
          setTimeout(()=>{ if(card.dataset.confirm==='1'){ delete card.dataset.confirm; btn.textContent='Удалить'; } },3000);
          return;
        }
        dashOrders=dashOrders.filter(x=>String(x.id)!==String(o.id));
        saveDash(dashOrders);
        card.remove();
        showToast(`Заказ #${o.id} удалён`);
        try{ rpc({op:'delete', id:o.id}).catch(()=>{});}catch{}
      }
    });

    return card;
  }

  function renderOrders(){
    const unique=new Map();
    dashOrders.forEach(o=>unique.set(String(o.id), o));
    const orders=[...unique.values()];
    list.innerHTML='';
    orders.forEach(o=>list.appendChild(orderCard(o)));
  }

  function load(){
    const unique=new Map();
    dashOrders.forEach(o=>unique.set(String(o.id), o));
    const incoming=[...unique.keys()].filter(id=>!knownIds.has(id));
    if(incoming.length){
      if(document.visibilityState==='visible' && soundOn()){
        try{ ding.currentTime=0; ding.play().catch(()=>{});}catch{}
      }else if(document.visibilityState==='hidden'){
        hiddenNewCount += incoming.length;
      }
    }
    knownIds=new Set(unique.keys());
    dashOrders=[...unique.values()];
    renderOrders();
  }

  root.querySelector('#btnClearAll').onclick=async ()=>{
    if(!confirm('Удалить все заказы?')) return;
    const ids=(dashOrders||[]).map(o=>o.id);
    dashOrders=[]; saveDash(dashOrders); load();
    try{ await rpc({op:'clear'}); }
    catch{ for(const id of ids){ try{ await rpc({op:'delete', id}); }catch{} } }
  };

  async function loadOrdersFromCloud(){
    try{
      const res=await rpc({op:'list'});
      if(Array.isArray(res.orders)){
        saveDash(res.orders);
        dashOrders=res.orders.slice();
        load();
      }
    }catch(e){ console.warn('loadOrdersFromCloud', e); }
  }

  load();
  loadOrdersFromCloud();
  pollTimer=setInterval(loadOrdersFromCloud,12000);

  root.cleanup=()=>{
    if(pollTimer) clearInterval(pollTimer);
    document.removeEventListener('visibilitychange', handleVisibilityChange);
  };
  return root;
}

function TerminalView(){
  let orders=loadDash();
  const root=el(`
    <div class="p-4 pb-10">
      <div class="grid grid-cols-2 gap-4">
        <section>
          <h2 class="text-xl font-bold mb-3">Готовится</h2>
          <div id="colCook" class="grid gap-3"></div>
        </section>
        <section>
          <h2 class="text-xl font-bold mb-3">Готово</h2>
          <div id="colDone" class="grid gap-3"></div>
        </section>
      </div>
    </div>
  `);

  const colCook=root.querySelector('#colCook');
  const colDone=root.querySelector('#colDone');

  function orderCard(o){
    const created=o.createdAt?new Date(o.createdAt):new Date();
    const itemsHtml=(o.items||[]).map(i=>`
      <div class="flex justify-between text-lg">
        <div>${i.name}</div>
        <div class="font-semibold">${i.qty}</div>
      </div>`).join('');

    return el(`
      <div class="p-4 rounded-2xl border shadow-sm bg-white">
        <div class="flex items-center justify-between">
          <div class="text-3xl font-extrabold tracking-tight">#${o.id||'—'}</div>
          <span class="px-2 py-1 rounded-full text-xs font-medium border bg-white/70">${o.status||'готовится'}</span>
        </div>
        <div class="text-gray-600 text-xs">${created.toLocaleString()}</div>
        <div class="mt-2 grid gap-1">${itemsHtml||'—'}</div>
        <div class="mt-2 text-lg font-bold">Итого: ${(o.total||0)} ₽</div>
      </div>
    `);
  }

  function render(){
    colCook.innerHTML=''; colDone.innerHTML='';
    orders.forEach(o=>{
      const st=o.status||'готовится';
      const card=orderCard(o);
      if(st==='готово'||st==='готов') colDone.appendChild(card);
      else colCook.appendChild(card);
    });
  }

  async function poll(){
    try{
      const res=await rpc({op:'list'});
      if(Array.isArray(res.orders)){
        orders=res.orders.slice();
        saveDash(orders);
        render();
      }
    }catch(e){ console.warn('terminal poll', e); }
  }

  render(); poll();
  const timer=setInterval(poll,4000);
  root.cleanup=()=>clearInterval(timer);
  return root;
}

function BuilderView(){
  const cfg = loadConfig();
  const root = el(`
    <div class="grid gap-4 pb-28">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Конструктор меню</h2>
        <div class="flex gap-2">
          <button id="exportBtn" class="px-3 py-2 rounded-xl border">Экспорт JSON</button>
          <label class="px-3 py-2 rounded-xl border cursor-pointer">
            Импорт JSON<input id="importInput" type="file" accept="application/json" class="hidden">
          </label>
          <button id="backBtn2" class="px-3 py-2 rounded-xl border">Назад</button>
        </div>
      </div>

      <section class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Категории и товары</h3>
          <button id="addCatBtn" class="px-3 py-2 rounded-xl border">+ Категория</button>
        </div>
        <div id="catsBox" class="grid gap-4"></div>
      </section>

      <div class="flex gap-2">
        <button id="applyBtn" class="px-4 py-3 rounded-xl bg-black text-white">Сохранить и обновить меню</button>
      </div>
    </div>
  `);

  const catsBox = root.querySelector('#catsBox');
  function render(){
    catsBox.innerHTML='';
    cfg.menu.forEach((cat, cidx)=>{
      const catCard = el(`
        <div class="border rounded-2xl p-3 bg-white">
          <div class="flex items-center justify-between">
            <input value="${cat.title}" class="border rounded-xl p-2 font-semibold w-1/2" data-k="title">
            <div class="flex gap-2">
              <button class="px-2 py-1 rounded-lg border" data-act="up">↑</button>
              <button class="px-2 py-1 rounded-lg border" data-act="down">↓</button>
              <button class="px-2 py-1 rounded-lg border text-red-600" data-act="del">Удалить</button>
            </div>
          </div>
          <div class="text-xs text-gray-500 mt-1">key: <code>${cat.key}</code></div>
          <div class="mt-3">
            <button class="px-3 py-2 rounded-xl border" data-act="addItem">+ Товар</button>
          </div>
          <div class="mt-3 grid gap-2" data-items></div>
        </div>
      `);
      const itemsBox = catCard.querySelector('[data-items]');
      cat.items.forEach((it, iidx)=>{
        const row = el(`
          <div class="grid grid-cols-12 gap-2 border rounded-xl p-2">
            <input class="col-span-5 border rounded-lg p-2" placeholder="Название" value="${it.name||''}" data-k="name">
            <input class="col-span-2 border rounded-lg p-2" type="number" placeholder="Цена" value="${it.price||0}" data-k="price">
            <input class="col-span-4 border rounded-lg p-2" placeholder="URL фото" value="${it.img||''}" data-k="img">
            <div class="col-span-1 flex items-center gap-1 justify-end">
              <button class="px-2 py-1 rounded-md border" data-act="iUp">↑</button>
              <button class="px-2 py-1 rounded-md border" data-act="iDown">↓</button>
              <button class="px-2 py-1 rounded-md border text-red-600" data-act="iDel">✕</button>
            </div>
          </div>
        `);
        row.addEventListener('input', (e)=>{
          const k=e.target.dataset.k;
          if(k==='price') cat.items[iidx][k]=Number(e.target.value||0);
          else cat.items[iidx][k]=e.target.value;
        });
        row.addEventListener('click',(e)=>{
          const act=e.target.dataset.act; if(!act) return;
          if(act==='iDel'){ cat.items.splice(iidx,1); render(); }
          if(act==='iUp' && iidx>0){ const t=cat.items[iidx-1]; cat.items[iidx-1]=cat.items[iidx]; cat.items[iidx]=t; render(); }
          if(act==='iDown' && iidx<cat.items.length-1){ const t=cat.items[iidx+1]; cat.items[iidx+1]=cat.items[iidx]; cat.items[iidx]=t; render(); }
        });
        itemsBox.appendChild(row);
      });

      catCard.addEventListener('input',(e)=>{ if(e.target.dataset.k==='title'){ cat.title=e.target.value; }});
      catCard.addEventListener('click',(e)=>{
        const act=e.target.dataset.act; if(!act) return;
        if(act==='del'){ if(confirm('Удалить категорию?')){ cfg.menu.splice(cidx,1); render(); } }
        if(act==='up' && cidx>0){ const t=cfg.menu[cidx-1]; cfg.menu[cidx-1]=cfg.menu[cidx]; cfg.menu[cidx]=t; render(); }
        if(act==='down' && cidx<cfg.menu.length-1){ const t=cfg.menu[cidx+1]; cfg.menu[cidx+1]=cfg.menu[cidx]; cfg.menu[cidx]=t; render(); }
        if(act==='addItem'){ cat.items.push({name:'Новый товар', price:0, img:''}); render(); }
      });

      catsBox.appendChild(catCard);
    });
  }
  render();

  root.querySelector('#addCatBtn').onclick=()=>{
    const id = 'cat'+(Date.now().toString().slice(-5));
    cfg.menu.push({ key:id, title:'Новая категория', items:[] });
    render();
  };

  root.querySelector('#exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='yamamoto-config.json'; a.click();
    URL.revokeObjectURL(a.href);
  };

  root.querySelector('#importInput').onchange=(e)=>{
    const f=e.target.files?.[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{ const json=JSON.parse(fr.result); saveConfig(json); showToast('Импортирован конфиг'); location.reload(); }
      catch{ alert('Неверный JSON'); }
    };
    fr.readAsText(f);
  };

  root.querySelector('#applyBtn').onclick=async ()=>{
    saveConfig(cfg);
    applyTheme(cfg.theme);
    MENU_CATEGORIES = cfg.menu.slice();
    try{ await rpc({ op: 'config_set', config: cfg }); }
    catch(e){ console.warn('config_set error', e); showToast('Меню сохранено локально, но сервер недоступен'); history.length?history.back():(location.hash='#/dashboard'); return; }
    showToast('Меню сохранено (сервер)');
    history.length?history.back():(location.hash='#/dashboard');
  };

  root.querySelector('#backBtn2').onclick=()=> history.length?history.back():(location.hash='#/dashboard');
  return root;
}

function mount(view){
  const app=document.getElementById('app');
  if(!app) return;
  if(app.firstChild && app.firstChild.cleanup) app.firstChild.cleanup();
  app.innerHTML='';
  app.classList.add('phone-shell');
  app.appendChild(view);
}

function realRouter(){
  const h=location.hash.split('?')[0];
  if(h==='#/dashboard') mount(DashboardView());
  else if(h==='#/terminal') mount(TerminalView());
  else if(h==='#/builder') mount(BuilderView());
  else mount(OrderView());
}

function router(){
  const h=location.hash.split('?')[0];
  const profileBtn=document.getElementById('profileBtn');
  const backBtn=document.getElementById('backBtn');
  profileBtn?.classList.add('hidden');

  const showBack=(h==='#/dashboard'||h==='#/builder'||h==='#/terminal');
  if(backBtn){ showBack?backBtn.classList.remove('hidden'):backBtn.classList.add('hidden'); }

  if((h==='#/dashboard'||h==='#/terminal') && sessionStorage.getItem(TABLO_PIN_OK)!=='1'){
    if(h==='#/dashboard') sessionStorage.setItem(WANT_DASH,'1');
    if(h==='#/terminal') sessionStorage.setItem(WANT_TERM,'1');
    document.getElementById('pinModal')?.classList.add('open');
    const app=document.getElementById('app'); if(app) app.innerHTML='';
    return;
  }
  realRouter();
}

window.addEventListener('hashchange', ()=>{ try{ router(); }catch(e){ console.error(e); }});
try{ router(); }catch(e){ console.error(e); }

document.addEventListener('DOMContentLoaded', async ()=>{
  document.getElementById('profileBtn')?.classList.add('hidden');

  /* бинд секретных точек в шапке */
  bindHeaderDots();

  const backBtn=document.getElementById('backBtn');
  const goOrder=(e)=>{ e&&e.preventDefault(); e&&e.stopPropagation(); location.hash='#/order'; };
  ['click','pointerup','touchend'].forEach(ev=> backBtn.addEventListener(ev, goOrder, {passive:false}));

  await fetchRemoteConfig().catch(()=>{});

  const pinM=document.getElementById('pinModal');
  const pinOk=document.getElementById('pinOk');
  const pinCancel=document.getElementById('pinCancel');
  const pinInput=document.getElementById('pinInput');

  pinOk.onclick=(e)=>{
    e&&e.preventDefault();
    if((pinInput.value||'').length>0){
      sessionStorage.setItem(TABLO_PIN_OK,'1');
      pinM.classList.remove('open');
      if(sessionStorage.getItem(WANT_DASH)==='1'){ sessionStorage.removeItem(WANT_DASH); location.hash='#/dashboard'; return; }
      if(sessionStorage.getItem(WANT_TERM)==='1'){ sessionStorage.removeItem(WANT_TERM); location.hash='#/terminal'; return; }
      router();
    } else showToast('Введите ключ');
  };
  pinCancel.onclick=()=>{
    pinM.classList.remove('open');
    sessionStorage.removeItem(WANT_DASH);
    sessionStorage.removeItem(WANT_TERM);
    location.hash='#/order';
  };
  pinM.onclick=(e)=>{ if(e.target===pinM) pinCancel.onclick(); };

  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('/sw.js'); console.log('Service worker registered'); }
    catch(e){ console.warn('SW registration failed', e); }
  }
  if('Notification' in window){
    if(Notification.permission==='default'){
      try{ const perm=await Notification.requestPermission(); if(perm==='granted') initPushSubscription().catch(()=>{}); }
      catch(e){ console.warn('Notification permission error', e); }
    }else if(Notification.permission==='granted'){
      initPushSubscription().catch(()=>{});
    }
  }
  window.addEventListener('hashchange', bindSecretZones);
});
  </script>
