<script>
/* ====== КОНСТАНТЫ ====== */

// === PUSH / VAPID ===
const VAPID_PUBLIC = 'BOdctEWx7fxuRtJB65AgcmgftUtHbFTBXX7qnpMCs5Bvh_hCErbrI18SGVzCJC8IoxP5LnMhjasuDlOvkgvbLRg';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64  = (base64String + padding)
    .replace(/-/g, '+')
    .replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}  
async function initPushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.warn('Push not supported');
    return;
  }

  const reg = await navigator.serviceWorker.ready;

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    } catch (e) {
      console.warn('Push subscribe error', e);
      return;
    }
  }

  try {
    await rpc({
      op: 'push_subscribe',
      clientId: getClientId(),
      subscription: sub
    });
  } catch (e) {
    console.warn('push_subscribe RPC error', e);
  }
}


/* ===== RPC ===== */
async function rpc(payload){
  if (!API_URL) throw new Error('API_URL empty');

  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'content-type':'application/json' },
    body: JSON.stringify(payload || {})
  });

  if (!res.ok) {
    const t = await res.text().catch(() => res.statusText);
    throw new Error(`RPC ${res.status}: ${t}`);
  }

  return res.json();
}

function getClientId(){
  let id = localStorage.getItem(CLIENT_ID_KEY);
  if (id) return id;

  const p = loadProfile();
  if (p && p.phone){
    // Привязываем ID к телефону, убираем пробелы
    id = 'tel:' + p.phone.replace(/\s+/g,'');

    id = 'guest-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
  }
  localStorage.setItem(CLIENT_ID_KEY, id);
  return id;

  function initTableIdFromUrl() {
  try {
    const sp = new URLSearchParams(location.search);
    // подхватываем ?table=1 или ?t=1
    const raw = sp.get('table') || sp.get('t');
    if (!raw) return;

    const cleaned = String(raw).trim();
    if (!cleaned) return;

    sessionStorage.setItem(TABLE_ID_KEY, cleaned);
  } catch (e) {
    console.warn('initTableIdFromUrl error', e);
  }
}

function getTableId() {
  return sessionStorage.getItem(TABLE_ID_KEY) || '';
}

  const name = (p.name || '').trim();

  const addr  = (p.address || '').trim();
  return !!(name && phone && addr);
}

async function fetchRemoteConfig(){
  // Вариант 1: отдельный JSON по URL (если когда-нибудь появится)
  if (CONFIG_REMOTE_URL){
    try{
      const res = await fetch(CONFIG_REMOTE_URL, { cache:'no-cache' });
      if(res.ok){
        const json = await res.json();
        if(json && json.menu){
          saveConfig(json);
          applyTheme(json.theme||{});
          MENU_CATEGORIES = json.menu.slice();
          return json;
        }
      }
    }catch(e){
      console.warn('fetchRemoteConfig URL', e);
    }
  }

  // Вариант 2: RPC к нашему бэку — общий конфиг для всех устройств
  try{
    const res = await rpc({ op: 'config_get' });
    if (res && res.config && Array.isArray(res.config.menu)){
      saveConfig(res.config);
      applyTheme(res.config.theme||{});
      MENU_CATEGORIES = res.config.menu.slice();
      return res.config;
    }
  }catch(e){
    console.warn('fetchRemoteConfig RPC', e);
  }
  return null;
}

/* ===== УДАЛЁННОЕ НАЛИЧИЕ ТОВАРОВ ===== */

// стянуть "нет в наличии" с сервера и сохранить локально
async function fetchUnavailableRemote(){
  try{
    const res = await rpc({ op: 'getUnavailable' });

    // на бэке мы всегда возвращаем { items: [...] }
    const items = Array.isArray(res?.items) ? res.items : [];

    // ВАЖНО: сохраняем ВСЕГДА, даже если список пустой
    saveUnavailable(items);

    return items;
  }catch(e){
    console.warn('fetchUnavailableRemote', e);
    return null;
  }
}

// отправить список отсутствующих товаров на сервер
async function pushUnavailableRemote(list){
  try{
    await rpc({
      op: 'setUnavailable',
      items: Array.isArray(list) ? list : []
    });
    showToast('Наличие обновлено на сервере');
  }catch(e){
    console.warn('pushUnavailableRemote', e);
    showToast('Не удалось обновить наличие на сервере');
  }
}

/* ===== анимации ===== */
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2 }
function animateScrollX(el, to, {duration=280, onEnd}={}){ const from=el.scrollLeft; const diff=to-from; if(!diff){ onEnd&&onEnd(); return; } const start=performance.now(); function step(ts){ const t=Math.min(1,(ts-start)/duration); el.scrollLeft=from+diff*easeInOutCubic(t); if(t<1) requestAnimationFrame(step); else onEnd&&onEnd(); } requestAnimationFrame(step); }

/* ===== синхронизация статуса локально ===== */
function syncOrderStatus(id, status){
  let hist = loadHistory(); let changed = false;
  for (let i=0;i<hist.length;i++){
    if (String(hist[i].id) === String(id)){
      if (hist[i].status !== status){ hist[i] = { ...hist[i], status }; changed = true; }
      break;
    }
  }
  if (changed){ saveHistory(hist); window.dispatchEvent(new CustomEvent('orders:history-updated')); }
}

/* === ПУЛЛИНГ СТАТУСОВ ИЗ ОБЛАКА === */
async function pullAndMergeStatuses(){
  try{
    const cloud = await rpc({ op:'list' });
    if(!cloud || !Array.isArray(cloud.orders)) return;

    const byId = new Map(cloud.orders.map(o => [String(o.id), o]));
    const hist = loadHistory();
    let changed = false;

    for (let i=0;i<hist.length;i++){
      const id = String(hist[i].id);
      const fromCloud = byId.get(id);
      if (!fromCloud) continue;

      // мержим не только статус, но и ETA (под пункт E)
      const next = {
        ...hist[i],
        status: fromCloud.status,
        etaMinutes: fromCloud.etaMinutes,
        etaUntil: fromCloud.etaUntil,
      };

      if (JSON.stringify(next) !== JSON.stringify(hist[i])) {
        hist[i] = next;
        changed = true;
      }
    }

    if(changed){
      saveHistory(hist);
      window.dispatchEvent(new CustomEvent('orders:history-updated'));
    }
  }catch(e){
    console.warn('pullAndMergeStatuses error', e);
  }
}

    // --- Карусель акций над меню ---

    function renderPromoStrip(categories) {
    const strip = root.querySelector('#promoStrip');
    const inner = root.querySelector('#promoStripInner');
    if (!strip || !inner) return;

    inner.innerHTML = '';
    promoSlides = [];

    (categories || []).forEach((cat, idx) => {
      if (cat && cat.promoUrl) {
        promoSlides.push({
          idx,
          title: cat.title || '',
          url: cat.promoUrl
        });
      }
    });

    if (!promoSlides.length) {
      strip.classList.add('hidden');
      promoIndex = 0;
      // на всякий случай глушим таймер, если он когда-то был
      if (promoTimer) {
        clearInterval(promoTimer);
        promoTimer = null;
      }
      return;

    strip.classList.remove('hidden');

    promoSlides.forEach((p, i) => {
      const slide = el(`
        <button type="button" class="promo-slide">
          <img src="${p.url}"
               alt="${p.title}"
               class="w-full h-32 sm:h-40 object-cover">
        </button>
      `);

      // тап по слайду — переход к нужной категории
      slide.addEventListener('click', () => {
        promoIndex = i;
        goToIndex(p.idx, { animate: true });
      });

      inner.appendChild(slide);
    });

    promoIndex = 0;
    inner.scrollLeft = 0;

    // ---- свайп по одному слайду ----
    let drag = false;
    let startX = 0;
    let startScroll = 0;

    const getSlideW = () => strip.getBoundingClientRect().width || 1;

    inner.onpointerdown = (e) => {
      if (e.pointerType && e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      drag = true;
      startX = e.clientX;
      startScroll = inner.scrollLeft;
      inner.setPointerCapture?.(e.pointerId);
    };

    inner.onpointermove = (e) => {
      if (!drag) return;
      if (e.pointerType && e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      const dx = startX - e.clientX;
      inner.scrollLeft = startScroll + dx;
      e.preventDefault();
    };

    const finishDrag = () => {
      if (!drag) return;
      drag = false;

      const slideW = getSlideW();
      let idx = Math.round(inner.scrollLeft / slideW);
      idx = Math.max(0, Math.min(promoSlides.length - 1, idx));
      promoIndex = idx;

      animateScrollX(inner, idx * slideW, { duration: 220 });
    };

    inner.onpointerup = finishDrag;
    inner.onpointercancel = finishDrag;
    inner.onpointerleave = finishDrag;
  }

function rebuildMenu() {

  cfg.menu.forEach((cat) => {

              <button

        </div>
      `);
      list.appendChild(row);
    });

    // запас снизу
    list.appendChild(el(`<div class="bottom-spacer"></div>`));

    vbox.appendChild(list);
    panel.appendChild(vbox);
    catPager.appendChild(panel);

    // === свайп по категориям (горизонтальный) ===
    const isIOS = /iP(ad|hone|od)/.test(navigator.userAgent);
    const supportsPointer = !!window.PointerEvent;

    let down   = false;
    let used   = false;
    let sx     = 0;
    let sy     = 0;
    let locked = null;

    const PIX_LOCK = 10;
    const THRESH = () =>
      Math.max(40, (catPager.getBoundingClientRect().width || 1) * 0.25);

    function startDrag(x, y) {
      if (isAnimating) return;
      down = true;
      used = false;
      sx = x;
      sy = y;
      locked = null;
    }

    function moveDrag(x, y, e) {
      if (!down || used || isAnimating) return;

      const dx = x - sx;
      const dy = y - sy;

      if (locked === null) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > PIX_LOCK) {
          locked = 'x';
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > PIX_LOCK) {
          locked = 'y';
        }
      }

      if (locked === 'x') {
        // горизонтальный жест — листаем категории
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }

        if (Math.abs(dx) >= THRESH()) {
          used = true;
          const next = dx < 0 ? activeIdx + 1 : activeIdx - 1;
          goToIndex(next, { animate: true });
        }
      }
    }

    function endDrag() {
      down = false;
      used = false;
      locked = null;
    }

    // ANDROID / другие — Pointer Events
    if (supportsPointer && !isIOS) {
      vbox.addEventListener('pointerdown', (e) => {
        const pt = e.pointerType;
        if (pt && pt !== 'touch') return;   // мышь игнорим
        startDrag(e.clientX, e.clientY);
      }, { passive: true });

      vbox.addEventListener('pointermove', (e) => {
        const pt = e.pointerType;
        if (pt && pt !== 'touch') return;
        moveDrag(e.clientX, e.clientY, e);
      }, { passive: false });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
        vbox.addEventListener(evt, endDrag, { passive: true })
      );

    // iOS — touch-события
    } else {
      vbox.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        if (!t) return;
        startDrag(t.clientX, t.clientY);
      }, { passive: true });

      vbox.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        if (!t) return;
        moveDrag(t.clientX, t.clientY, e);
      }, { passive: false });

      ['touchend', 'touchcancel'].forEach(evt =>
        vbox.addEventListener(evt, endDrag, { passive: true })
      );
    }
    // === конец свайпа ===
  });
}

    window.__orderCounts[name] = next;

root.querySelectorAll('.bottom-spacer').forEach(el => {

            items: itemsSel,
            total,
            pay: sel.value || 'cash',
            table: tableId || null
          }
        });

        const order = res && res.order ? res.order : {
          id: Date.now().toString().slice(-6),
          createdAt: Date.now(),
          items: itemsSel,
          total,
          pay: sel.value || 'cash',
          status: 'новый',
          table: tableId || null
        };

        const history = loadHistory();
        history.unshift(order);
        saveHistory(history.slice(0, 50));

        const dash = loadDash();
        dash.unshift(order);
        saveDash(dash.slice(0, 200));

           } catch (err) {
        console.warn('RPC create error', err);
        showToast('Не удалось отправить заказ, попробуйте ещё раз.');
        ok.disabled = false;
        finalize();
        return;
      }

      ok.disabled = false;
      finalize();
      resetCounts();
      window.dispatchEvent(new CustomEvent('orders:history-updated'));
      showDoneModal();
    };

    if (ok._handler)     ok.removeEventListener('click', ok._handler);
    if (cancel._handler) cancel.removeEventListener('click', cancel._handler);

    ok._handler     = onOk;
    cancel._handler = onCancel;

    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);

    m.onclick = (e) => { if (e.target === m) onCancel(e); };
  })();

  renderPromoStrip(loadConfig().menu);
  
   rebuildMenu();

  requestAnimationFrame(() => {
    // выставляем высоты для внутреннего скролла
    applyHeights();

    highlightChip(0);
    goToIndex(0, { animate:false });
    recalcTotal();
    applyRepeatOrder();
  });

  // реагируем на изменения склада
  window.addEventListener('stock:updated', handleStockUpdated);

  // периодический синк: конфиг, статусы, наличие
  const syncTimer = setInterval(async () => {
    // конфиг меню
    try {
      const cfgRemote = await fetchRemoteConfig();
      if (cfgRemote){
        const v = calcConfigVersion(cfgRemote);
        if (v !== lastConfigVersion){
          lastConfigVersion = v;
          renderPromoStrip(cfgRemote.menu || []);
          rebuildMenu();
          recalcTotal();
          applyHeights();
        }
      }
    } catch (e) {}

    // статусы заказов
    await pullAndMergeStatuses().catch(() => {});

    // наличие с сервера
    const before = new Set(unavailableClient);
   const remote = await fetchUnavailableRemote().catch(() => []);
if (Array.isArray(remote)){
      const after = new Set(remote);
      if (
        before.size !== after.size ||
        [...before].some(x => !after.has(x))
      ){
        unavailableClient = after;
        rebuildMenu();
        recalcTotal();
        applyHeights();
      }
    }
  }, 4000);

  root.cleanup = () => {
    setBodyScrollLock(false);
    clearInterval(syncTimer);
    if (promoTimer) clearInterval(promoTimer);
    window.removeEventListener('stock:updated', handleStockUpdated);
    window.removeEventListener('resize', applyHeights);
  };

  return root;
}

      : '';

    const elCard = el(`
      <div class="card p-4 ${outerBg}">
        <div class="flex items-center justify-between">
          <div class="text-2xl font-extrabold">№ ${o.id || '—'}</div>
          <span class="chip ${chipClass}">${o.status || 'новый'}</span>

      sessionStorage.setItem('repeat_order_items', JSON.stringify(items));
      sessionStorage.setItem('open_pay_after_repeat', '1');
      location.hash = '#/order';
    };

    elCard.querySelector('[data-del]').onclick = () => {
      const cur = loadHistory();
      cur.splice(idx, 1);

      render();

  pullAndMergeStatuses().then(render).catch(() => render());

    render();
  }, 7000);

  root.cleanup = () => clearInterval(syncTimer);

  return root;

async function exportReportXlsx() {
  // 1. Берём заказы с сервера (или локальный fallback)
  let allOrders = [];
  try {
    const res = await rpc({ op: 'list', all: true });
    if (Array.isArray(res.orders)) {
      allOrders = res.orders;
    }
  } catch (e) {
    console.warn('exportReportXlsx: rpc list error, fallback to local dashOrders', e);
    if (typeof window !== 'undefined' && Array.isArray(window.__dashOrders)) {
      allOrders = window.__dashOrders.slice();
    }
  }

  if (!allOrders.length) {
    showToast('Нет заказов для отчёта');
    return;
  }

  // 2. Спрашиваем отчётный месяц / период
  const monthInput = prompt(
    'Отчёт за месяц (формат ГГГГ-ММ, оставь пустым — текущий месяц):',
    ''
  );

  const pad = n => String(n).padStart(2, '0');
  const MS_DAY = 24 * 60 * 60 * 1000;
  let from, to;
  const now = new Date();

  if (!monthInput) {
    // Текущий месяц
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to   = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else {
    const [yStr, mStr] = monthInput.split('-');
    const y = Number(yStr);
    const m = Number(mStr) - 1;
    if (!y || m < 0 || m > 11) {
      showToast('Неверный формат месяца');
      return;
    }
    from = new Date(y, m, 1);
    to   = new Date(y, m + 1, 1);
  }

  const fromTs = from.getTime();
  const toTs   = to.getTime();

  // 3. Фильтруем заказы в выбранном периоде
  const orders = allOrders.filter(o => {
    const t = Number(o.createdAt || 0);
    return t >= fromTs && t < toTs;
  });

  if (!orders.length) {
    showToast('В этом периоде нет заказов');
    return;
  }

  // ==== АНАЛИТИКА: выручка, по дням, по товарам, время готовки ====
  let totalRevenue = 0;
  const perDaySum  = new Map();  // 'YYYY-MM-DD' -> сумма
  const perItemAgg = new Map();  // name -> { qty, sum, cookSumMin, cookCount }

  const rows = [];

  const dateKey = (d) => [
    d.getFullYear(),
    pad(d.getMonth() + 1),
    pad(d.getDate())
  ].join('-');

  orders.forEach(o => {
    const created = o.createdAt ? new Date(o.createdAt) : null;
    const readyTs = o.readyAt ? Number(o.readyAt) : null;
    const items   = Array.isArray(o.items) ? o.items : [];

    const clientTotal = items.reduce((s, it) => {
      const q = Number(it.qty || 0);
      const p = Number(it.price || 0);
      return s + q * p;
    }, 0);

    const orderTotal = typeof o.total === 'number'
      ? Math.max(o.total, clientTotal)
      : clientTotal;

    totalRevenue += orderTotal;

    if (created) {
      const dKey = dateKey(created);
      perDaySum.set(dKey, (perDaySum.get(dKey) || 0) + orderTotal);
    }

    // Время готовки заказа (если есть readyAt)
    let cookMinutesOrder = null;
    if (created && readyTs && readyTs > created.getTime()) {
      cookMinutesOrder = (readyTs - created.getTime()) / 60000; // в минутах
    }

    const base = {
      'Дата/время': created ? created.toLocaleString() : '',
      'Номер заказа': o.id || '',
      'Столик': o.table || '',
      'Способ оплаты': o.pay || '',
      'Статус заказа': o.status || '',
      'Сумма заказа': orderTotal
    };

    if (!items.length) {
      rows.push({
        ...base,
        'Позиция': '',
        'Кол-во': '',
        'Цена за шт.': '',
        'Сумма позиции': '',
        'Время готовки заказа, мин': cookMinutesOrder != null
          ? Math.round(cookMinutesOrder * 10) / 10
          : ''
      });
    } else {
      items.forEach(it => {
        const qty   = Number(it.qty || 0);
        const price = Number(it.price || 0);
        const sum   = qty * price;

        // Агрегация по блюдам
        if (it.name) {
          const agg = perItemAgg.get(it.name) || {
            qty: 0,
            sum: 0,
            cookSumMin: 0,
            cookCount: 0
          };
          agg.qty += qty;
          agg.sum += sum;

          // Время готовки считаем один раз на заказ, но распространяем на каждую позицию
          if (cookMinutesOrder != null) {
            agg.cookSumMin += cookMinutesOrder;
            agg.cookCount += 1;
          }

          perItemAgg.set(it.name, agg);
        }

        rows.push({
          ...base,
          'Позиция': it.name || '',
          'Кол-во': qty,
          'Цена за шт.': price,
          'Сумма позиции': sum,
          'Время готовки заказа, мин': cookMinutesOrder != null
            ? Math.round(cookMinutesOrder * 10) / 10
            : ''
        });
      });
    }
  });

  // ==== Средняя выручка в день / неделю / месяц (за период) ====
  const totalPeriodDays = Math.max(1, Math.round((toTs - fromTs) / MS_DAY));
  const avgDay    = totalRevenue / totalPeriodDays;         // средняя по календарным дням периода
  const avgWeek   = avgDay * 7;
  const avgMonth  = avgDay * 30; // условный месяц 30 дней

  const activeDayCount = perDaySum.size;
  const avgDayActive = activeDayCount
    ? totalRevenue / activeDayCount
    : 0;

  // ==== Топы за день / неделю / месяц (внутри выбранного периода) ====
  const dayStartTs   = Math.max(fromTs, toTs - MS_DAY);
  const weekStartTs  = Math.max(fromTs, toTs - 7 * MS_DAY);
  const monthStartTs = Math.max(fromTs, toTs - 30 * MS_DAY);

  function topForRange(startTs) {
    const agg = new Map();
    orders.forEach(o => {
      const t = Number(o.createdAt || 0);
      if (!(t >= startTs && t < toTs)) return;
      const items = Array.isArray(o.items) ? o.items : [];
      items.forEach(it => {
        if (!it.name) return;
        const q = Number(it.qty || 0);
        const p = Number(it.price || 0);
        const sum = q * p;
        const rec = agg.get(it.name) || { qty: 0, sum: 0 };
        rec.qty += q;
        rec.sum += sum;
        agg.set(it.name, rec);
      });
    });
    return [...agg.entries()]
      .map(([name, v]) => ({ name, qty: v.qty, sum: v.sum }))
      .sort((a, b) => b.qty - a.qty);  // сорт по количеству
  }

  const topDay   = topForRange(dayStartTs);
  const topWeek  = topForRange(weekStartTs);
  const topMonth = topForRange(monthStartTs);

  // ==== Среднее время готовки по блюдам ====
  const cookRows = [...perItemAgg.entries()]
    .map(([name, agg]) => ({
      'Позиция': name,
      'Всего заказов с этим блюдом': agg.cookCount,
      'Среднее время готовки, мин': agg.cookCount
        ? Math.round((agg.cookSumMin / agg.cookCount) * 10) / 10
        : '',
      'Общее количество, шт': agg.qty,
      'Общая выручка, руб': agg.sum
    }))
    .sort((a, b) => (b['Среднее время готовки, мин'] || 0) - (a['Среднее время готовки, мин'] || 0));

  // ==== Формируем Excel-книгу ====
  const wb = XLSX.utils.book_new();

  // Лист 1: детальные строки по заказам
  const wsOrders = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, wsOrders, 'Заказы');

  // Лист 2: сводка по выручке
  const summaryRows = [
    { 'Показатель': 'Всего заказов в периоде', 'Значение': orders.length },
    { 'Показатель': 'Всего выручка за период', 'Значение': Math.round(totalRevenue) },
    { 'Показатель': 'Дней в периоде (календарных)', 'Значение': totalPeriodDays },
    { 'Показатель': 'Дней с заказами', 'Значение': activeDayCount },
    { 'Показатель': 'Средняя выручка/день (по всем дням периода)', 'Значение': Math.round(avgDay) },
    { 'Показатель': 'Средняя выручка/день (только в дни с заказами)', 'Значение': Math.round(avgDayActive) },
    { 'Показатель': 'Средняя выручка/неделю (расчёт от среднего дня)', 'Значение': Math.round(avgWeek) },
    { 'Показатель': 'Средняя выручка/месяц (≈30 дней)', 'Значение': Math.round(avgMonth) }
  ];
  const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Сводка');

  // Лист 3: среднее время готовки по блюдам
  const wsCook = XLSX.utils.json_to_sheet(cookRows);
  XLSX.utils.book_append_sheet(wb, wsCook, 'Время готовки');

  // Лист 4: топы за день/неделю/месяц
  const topSheetRows = [];

  topSheetRows.push({ 'Блок': 'Топ за день (последние 24 часа периода)', 'Позиция': '', 'Кол-во': '', 'Выручка': '' });
  topDay.forEach(it => {
    topSheetRows.push({
      'Блок': 'День',
      'Позиция': it.name,
      'Кол-во': it.qty,
      'Выручка': it.sum
    });
  });

  topSheetRows.push({ 'Блок': 'Топ за неделю (последние 7 дней периода)', 'Позиция': '', 'Кол-во': '', 'Выручка': '' });
  topWeek.forEach(it => {
    topSheetRows.push({
      'Блок': 'Неделя',
      'Позиция': it.name,
      'Кол-во': it.qty,
      'Выручка': it.sum
    });
  });

  topSheetRows.push({ 'Блок': 'Топ за месяц (последние 30 дней периода)', 'Позиция': '', 'Кол-во': '', 'Выручка': '' });
  topMonth.forEach(it => {
    topSheetRows.push({
      'Блок': 'Месяц',
      'Позиция': it.name,
      'Кол-во': it.qty,
      'Выручка': it.sum
    });
  });

  const wsTop = XLSX.utils.json_to_sheet(topSheetRows);
  XLSX.utils.book_append_sheet(wb, wsTop, 'Топы');

  const fname = `report_${from.getFullYear()}-${pad(from.getMonth() + 1)}.xlsx`;
  XLSX.writeFile(wb, fname);

  showToast('Отчёт выгружен');
}

  function orderCard(o){
    const clientTotal = (o.items || []).reduce(
      (s, i) => s + (i.price || 0) * (i.qty || 0),
      0
    );
    const total   = Math.max(typeof o.total === 'number' ? o.total : 0, clientTotal);
    const created = o.createdAt ? new Date(o.createdAt) : new Date();

    const colorMap = {
      'новый':     'bg-yellow-50 border-yellow-300',
      'готовится': 'bg-blue-50 border-blue-300',
      'в пути':    'bg-purple-50 border-purple-300',
      'готов':     'bg-green-50 border-green-300',
      'завершён':  'bg-gray-100 border-gray-300',
      'отменён':   'bg-red-50 border-red-300'
    };
    const statusColor = colorMap[o.status] || 'bg-white border-gray-200';

    const itemsHtml = (o.items || []).map(i => `
      <div class="flex justify-between text-lg">
        <div>${i.name}</div>
        <div class="font-semibold">${i.qty} × ${i.price}</div>

    const etaBlock = o.etaUntil
      ? `<div class="text-sm text-gray-700 mt-1">
           Готово примерно в ${new Date(o.etaUntil).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
         </div>`
      : '';

       const card = el(`
      <div class="p-6 rounded-3xl border-2 ${statusColor} shadow-sm flex flex-col gap-3 transition-transform hover:scale-[1.01]" data-id="${o.id}">

          </div>

        </div>
        <div class="text-gray-600 text-sm">${created.toLocaleString()}</div>
        ${etaBlock}
        <div class="mt-2 grid gap-1 text-lg">
          ${itemsHtml || '—'}
        </div>
        <div class="mt-3 flex items-center justify-between text-xl font-bold">
          <div>Итого:</div><div>${total} ₽</div>
        </div>
            <div class="mt-2 flex flex-wrap gap-2 items-center">
          <button
            type="button"
            class="px-3 py-2 rounded-xl border bg-white hover:bg-gray-100"
            data-act="ready"
          >
            Готово
          </button>
          <button
            type="button"
            class="px-3 py-2 rounded-xl border bg-red-50 hover:bg-red-100 text-red-600 ml-auto"
            data-act="delete"
          >
            Удалить
          </button>
        </div>
      </div>
    `);

    card.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;

               if (act === 'ready'){
      const nowTs = Date.now();
      const patch = { status: 'готов', readyAt: nowTs };

      const i = dashOrders.findIndex(x => String(x.id) === String(o.id));
      if (i >= 0){
        dashOrders[i] = { ...dashOrders[i], ...patch };
        saveDash(dashOrders);
        syncOrderStatus(o.id, patch.status);
        showToast(`Заказ #${o.id} отмечен как готов`);
        renderOrders();
      }

      try { rpc({ op: 'update', id: o.id, patch }).catch(()=>{}); } catch {}

    } else if (act === 'delete'){

        if (!card.dataset.confirm){
          card.dataset.confirm = '1';
          btn.textContent = 'Точно удалить?';
          setTimeout(() => {
            if (card && card.dataset.confirm === '1'){
              delete card.dataset.confirm;
              btn.textContent = 'Удалить';
            }
          }, 3000);
          return;
        }

        dashOrders = dashOrders.filter(x => String(x.id) !== String(o.id));
        saveDash(dashOrders);
        card.remove();
        showToast(`Заказ #${o.id} удалён`);

        try { rpc({ op: 'delete', id: o.id }).catch(()=>{}); } catch {}
      }
    });

    return card;
  }

  function renderOrders(){
    const unique = new Map();
    dashOrders.forEach(o => unique.set(String(o.id), o));
    const orders = [...unique.values()];
    list.innerHTML = '';
    orders.forEach(o => list.appendChild(orderCard(o)));
  }

  function load(){
    const unique = new Map();
    dashOrders.forEach(o => unique.set(String(o.id), o));

    const incoming = [...unique.keys()].filter(id => !knownIds.has(id));

    if (incoming.length){
      if (document.visibilityState === 'visible' && soundOn()){
        try {
          ding.currentTime = 0;
          ding.play().catch(()=>{});
        } catch {}
      } else if (document.visibilityState === 'hidden'){
        hiddenNewCount += incoming.length;
      }
    }

    knownIds = new Set(unique.keys());
    dashOrders = [...unique.values()];
    renderOrders();
  }

    root.querySelector('#btnClearAll').onclick = async () => {
    if (!confirm('Очистить только табло (заказы останутся в истории и отчётах)?')) return;

    // запоминаем, что все заказы до этого момента — "старые", их не показываем

    dashOrders = [];
    saveDash(dashOrders);
    window.__dashOrders = dashOrders;
    knownIds = new Set();

    root.querySelector('#btnClearHistory').onclick = async () => {

      return;

    if (pin !== '65Vafuza') {

    try {

   async function loadOrdersFromCloud(){
    try{
      const res = await rpc({ op:'list' });
      if (Array.isArray(res.orders)){
        let serverOrders = res.orders.slice();

        // фильтруем по моменту последней очистки табло
        const clearedAfter = Number(localStorage.getItem(DASH_CLEARED_AFTER_KEY) || 0);
        if (clearedAfter) {
          serverOrders = serverOrders.filter(o => {
            const t = Number(o.createdAt || 0);
            return !t || t >= clearedAfter;
          });
        }

        saveDash(serverOrders);
        dashOrders = serverOrders.slice();
        window.__dashOrders = dashOrders;
        load();
      }
    } catch(e){
      console.warn('loadOrdersFromCloud', e);
    }
  }

  load();
  loadOrdersFromCloud();
  pollTimer = setInterval(loadOrdersFromCloud, 3000);

  root.cleanup = () => {
    if (pollTimer) clearInterval(pollTimer);
    document.removeEventListener('visibilitychange', handleVisibilityChange);
  };

  return root;
}

/* ===== 4-тап зона ===== */
function bindTabloTapZone(){
  const hot = document.getElementById('profileBtn');
  if (!hot || hot._bound) return; hot._bound = true;
  let taps = 0, first = 0, timer = null;
  const windowMs = 1200;
  function reset(){ taps = 0; first = 0; if (timer){ clearTimeout(timer); timer = null; } }
  function handler(){
    const now = Date.now();
    if (!first) first = now; taps++;
    if (now - first > windowMs){ reset(); taps = 1; first = now; }
    if (taps >= 4){
      reset();
      document.getElementById('payModal')?.classList.remove('open');
      if (sessionStorage.getItem(TABLO_PIN_OK) === '1'){ location.hash = '#/dashboard'; }
      else { sessionStorage.setItem(WANT_DASH,'1'); document.getElementById('pinModal').classList.add('open'); }
    }else{ if (timer) clearTimeout(timer); timer = setTimeout(reset, windowMs); }
  }
  ['click','pointerup','touchend'].forEach(ev => hot.addEventListener(ev, (e)=>{ e.preventDefault(); e.stopPropagation(); handler(); }, {passive:false}));
}

/* ===== Router ===== */
function mount(view){
  const app = document.getElementById('app');
  if (app.firstChild && typeof app.firstChild.cleanup === 'function') {
    try { app.firstChild.cleanup(); } catch {}
  }
  app.innerHTML = '';
  app.classList.add('phone-shell');
  app.appendChild(view);
}

function realRouter(){
  const h = location.hash.split('?')[0];
  if (h === '#/profile-edit') mount(ProfileEditView());
  else if (h === '#/history') mount(HistoryView());
  else if (h === '#/dashboard') mount(DashboardView());
  else if (h === '#/builder') mount(BuilderView());
  else mount(OrderView());
}

// просто решает, какой хедер показывать и можно ли идти на табло
function router(){
  const h = location.hash.split('?')[0];
  const profileBtn = document.getElementById('profileBtn');
  const backBtn    = document.getElementById('backBtn');

  const showBack =
    h === '#/history' ||
    h === '#/profile-edit' ||
    h === '#/builder';

  if (showBack) {
    profileBtn.classList.add('hidden');
    backBtn.classList.remove('hidden');
  } else {
    backBtn.classList.add('hidden');
    profileBtn.classList.remove('hidden');
  }

  // защищаем табло PIN-ом
  if (h === '#/dashboard' && sessionStorage.getItem(TABLO_PIN_OK) !== '1') {
    sessionStorage.setItem(WANT_DASH, '1');
    document.getElementById('pinModal').classList.add('open');
    const app = document.getElementById('app');
    if (app) app.innerHTML = '';
    return;
  }

  realRouter();
}

// реагируем на смену hash
window.addEventListener('hashchange', () => {
  try { router(); } catch (e) { console.error(e); }
});

      }
