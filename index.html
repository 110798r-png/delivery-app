<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ЯмаMoto — Терминал</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="icon" href="data:,">
  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #f9fafb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    img { max-width: 100%; display:block; }
    .hidden { display:none; }
    .phone-shell { width:min(100vw,540px); margin:0 auto; padding:0 .35rem; }

    .toast{
      position:fixed; right:1rem; bottom:1rem; background:#111; color:#fff;
      padding:.75rem 1rem; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.2);
      opacity:.95; z-index:9999
    }

    .glass-panel{
      background:radial-gradient(circle at 10% 20%,
        rgba(255,255,255,.85) 0%,
        rgba(255,255,255,.45) 45%,
        rgba(255,255,255,.25) 100%);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.4);
      box-shadow:0 14px 40px rgba(15,23,42,.12)
    }
    .no-scrollbar::-webkit-scrollbar{ display:none }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none }
    .sticky-top{ position:sticky; top:.5rem; z-index:30 }

    .menu-card{
      display:flex; gap:.75rem; align-items:center; background:#fff; border:1px solid #edf2f7;
      border-radius:var(--card-radius, 1.25rem); padding:1rem; min-height:var(--card-min-h, 6.4rem)
    }
    .menu-card-img{
      width:var(--img-w,110px); height:var(--img-h,70px);
      border-radius:var(--img-radius,.75rem);
      background:#eee; object-fit:cover
    }

    .confirm-bar{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:0; width:min(540px, 100%);
      background:#fff; border-top:1px solid #e5e7eb;
      padding:.6rem .9rem; z-index:50;
      box-shadow:0 -10px 25px rgba(15,23,42,.06)
    }

    #catPager{
      display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch; touch-action: pan-x pinch-zoom;
    }
    .cat-panel{ flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop: always; padding:0; }
    .v-scroll{
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain; touch-action: pan-y;
    }

    .modal{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.45); z-index:90
    }
    .modal.open{ display:flex }

    .card{
      border-radius:1.25rem; background:#fff; border:1px solid #edf2f7;
      box-shadow:0 8px 24px rgba(15,23,42,.06);
    }

    /* --- Красная шапка --- */
    .brand-strip{ background:#e50000; color:#fff; }
    .brand-title{ font-weight:900; font-size:24px; line-height:1; letter-spacing:.2px; }
    .brand-sub{ font-size:11px; line-height:1; opacity:.9; margin-top:2px; letter-spacing:.3px }
    .brand-wrap{ display:flex; align-items:center; gap:10px; }
    .sushi-icon{
      width:36px; height:36px; border-radius:999px;
      display:grid; place-items:center; background:#000;
    }
    .sushi-icon svg{ width:24px; height:24px; }
    .header-row{ padding:10px 12px; }
    .header-ghost{ height:8px; }

    button, a, svg, .brand-strip, .header-row{
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    button:focus, a:focus{ outline:none; box-shadow:none; }

    /* 14" горизонталь / большой экран */
    @media (min-width: 1000px) {
      #app.phone-shell { max-width: 1000px; }
      .confirm-bar { width:min(1000px,100%); }
    }

    /* Плавающая кнопка в табло кухни (видимая) */
    #openKitchenBtn{
      position:fixed; right:16px; bottom:86px; z-index:80;
      width:56px; height:56px; border-radius:999px;
      background:#111; color:#fff; display:grid; place-items:center;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      opacity:.9;
    }
    #openKitchenBtn:active{ transform:scale(.96); }

    /* Скрытые зоны тапов */
    #hotLeft, #hotRight {
      position:fixed; bottom:0; width:220px; height:140px; z-index:9998;
      opacity:0; pointer-events:auto;
    }
    #hotLeft { left:0; }
    #hotRight { right:0; }
  </style>
</head>

<body>
  <div class="w-full">
    <!-- Красная шапка -->
    <div class="brand-strip">
      <div class="phone-shell header-row flex items-center justify-between">
        <div class="brand-wrap">
          <div class="sushi-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#fff"/>
              <circle cx="12" cy="12" r="7" fill="#e50000"/>
              <circle cx="12" cy="12" r="4" fill="#000"/>
            </svg>
          </div>
          <div class="leading-tight">
            <div class="brand-title" id="brandTitle">ЯмаMoto</div>
            <div class="brand-sub">суши • роллы • фастфуд</div>
          </div>
        </div>
        <!-- личный кабинет убран -->
      </div>
    </div>
    <div class="header-ghost"></div>

    <main id="app" class="phone-shell"></main>
  </div>

  <!-- Плавающая кнопка на табло кухни -->
  <button id="openKitchenBtn" title="Табло кухни" aria-label="Табло кухни">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="4" width="18" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
      <rect x="3" y="14" width="18" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M7 7h4M7 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Скрытые зоны 8-тапа -->
  <div id="hotLeft" aria-label="hidden-left"></div>
  <div id="hotRight" aria-label="hidden-right"></div>

  <!-- Подтверждение заказа -->
  <div id="payModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-xl" role="dialog" aria-modal="true">
      <h3 class="text-lg font-semibold">Подтверждение заказа</h3>
      <div id="paySummary" class="text-sm bg-gray-50 border rounded-xl p-3 max-h-60 overflow-auto"></div>

      <div class="grid gap-2">
        <button id="payByQr" type="button" class="px-3 py-2 rounded-xl bg-black text-white w-full">
          Оплатить по QR (СБП)
        </button>
        <button id="payByCard" type="button" class="px-3 py-2 rounded-xl border w-full">
          Оплата картой (POS позже)
        </button>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="payCancel" type="button" class="px-3 py-2 rounded-xl border">Изменить</button>
      </div>
    </div>
  </div>

  <!-- QR модалка -->
  <div id="qrModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-xl text-center">
      <h3 class="text-lg font-semibold">Оплата по СБП</h3>
      <div class="text-sm text-gray-600">
        Отсканируйте QR и оплатите заказ
      </div>

      <img id="qrImg"
           class="mx-auto rounded-xl border w-64 h-64 object-contain"
           alt="QR">

      <div class="text-xs text-gray-500">
        Если QR не настроен — вставь URL картинки в localStorage ключ:
        <b>sbp_qr_url</b>
      </div>

      <button id="qrPaidBtn" type="button" class="px-3 py-2 rounded-xl bg-black text-white w-full">
        Я оплатил(а)
      </button>

      <button id="qrCloseBtn" type="button" class="px-3 py-2 rounded-xl border w-full">
        Закрыть
      </button>
    </div>
  </div>

  <!-- PIN модалка -->
  <div id="pinModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs space-y-3 shadow-xl text-center">
      <h3 class="text-lg font-semibold">Введите PIN</h3>
      <input id="pinInput"
             class="border rounded-2xl p-3 w-full text-center"
             placeholder="PIN"
             inputmode="text">
      <div class="flex justify-end gap-2">
        <button id="pinCancel" class="px-3 py-2 rounded-xl border">Отмена</button>
        <button id="pinOk" class="px-3 py-2 rounded-xl bg-black text-white">ОК</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- звук новых заказов -->
  <audio id="orderDing" preload="auto">
    <source src="https://storage.yandexcloud.net/audio123/z_uk-budte-vkontakte-s-no_ostyami%20(1).mp3" type="audio/mpeg">
  </audio>

  <script>
  // ========= ПОЛИФИЛЫ =========
  if (!Element.prototype.matches) {
    Element.prototype.matches =
      Element.prototype.msMatchesSelector ||
      Element.prototype.webkitMatchesSelector ||
      function (selector) {
        const matches = (this.document || this.ownerDocument).querySelectorAll(selector);
        let i = matches.length;
        while (--i >= 0 && matches.item(i) !== this) {}
        return i > -1;
      };
  }
  if (!Element.prototype.closest) {
    Element.prototype.closest = function (selector) {
      let el = this;
      while (el && el.nodeType === 1) {
        if (el.matches(selector)) return el;
        el = el.parentElement || el.parentNode;
      }
      return null;
    };
  }
  if (!window.CSS) window.CSS = {};
  if (typeof window.CSS.escape !== 'function') {
    window.CSS.escape = function (value) {
      return String(value).replace(/"/g, '\\"');
    };
  }
  

  <script>
  (function(){
    /* ================== КОНСТАНТЫ ================== */
    const API_URL = '/api/order';

    const CONFIG_LS_KEY      = 'app_config_v1';
    const DASHBOARD_LS_KEY   = 'dashboard_orders_v1';
    const CLIENT_HISTORY_KEY = 'orders_client_history_v1';
    const SOUND_ON_KEY       = 'sound_on_v1';

    const TABLO_PIN_OK       = 'TABLO_PIN_OK';
    const WANT_ADMIN_ROUTE   = 'WANT_ADMIN_ROUTE';

    const PIN_CODE = '65Vafuza'; // твой PIN

    /* ================== УТИЛИТЫ ================== */
    const el = (html)=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };

    const showToast = (msg)=>{
      const t=document.getElementById('toast');
      t.textContent=msg;
      t.classList.remove('hidden');
      setTimeout(()=>t.classList.add('hidden'), 1800);
    };

    const money = (x)=> `${x} руб.`;
    const setBodyScrollLock = (on)=> document.body.style.overflow = on ? 'hidden' : '';

    function safeParse(k, f){
      try{
        const v=JSON.parse(localStorage.getItem(k)||'null');
        if(v==null) return f;
        if(Array.isArray(f)) return Array.isArray(v)?v:[];
        if(typeof f==='object') return v&&typeof v==='object'?v:{};
        return v;
      }catch{ return f }
    }

    function loadHistory(){ return safeParse(CLIENT_HISTORY_KEY, []); }
    function saveHistory(list){
      const arr = Array.isArray(list) ? list : [];
      localStorage.setItem(CLIENT_HISTORY_KEY, JSON.stringify(arr));
    }

    function loadDash(){ return safeParse(DASHBOARD_LS_KEY, []); }
    function saveDash(list){
      const arr = Array.isArray(list) ? list : [];
      localStorage.setItem(DASHBOARD_LS_KEY, JSON.stringify(arr));
    }

    /* ================== RPC ================== */
    async function rpc(payload){
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'content-type':'application/json' },
        body: JSON.stringify(payload || {})
      });
      if (!res.ok) {
        const t = await res.text().catch(() => res.statusText);
        throw new Error(`RPC ${res.status}: ${t}`);
      }
      return res.json();
    }

    /* ================== КОНФИГ ================== */
    const DEFAULT_CONFIG = {
      brandTitle: 'ЯмаMoto',
      terminalAdUrl: "",         // реклама URL (видео/гиф)
      terminalAdType: "video",   // "video" | "gif"
      sbpQrUrl: "",              // URL картинки QR (если не хочешь localStorage)
      theme: {
        cardRadius:20,
        imgRadius:12,
        imgW:110,
        imgH:70,
        cardMinH:104,
        showPrice:true
      },
      menu: [
        { key:'burgers', title:'Бургеры', items:[
          { name:'Говяжий бургер', price:280, img:'https://images.unsplash.com/photo-1603064752734-4c48eff53d05?w=400&auto=format&fit=crop' },
          { name:'Говяжий двойной', price:440, img:'https://images.unsplash.com/photo-1516684541-b4de0a07a2e1?w=400&auto=format&fit=crop' },
          { name:'Куриный бургер',  price:200, img:'https://images.unsplash.com/photo-1604908176997-1251882fde0b?w=400&auto=format&fit=crop' },
          { name:'Куриный двойной', price:250, img:'https://images.unsplash.com/photo-1603366615917-1fa6dad5c4fa?w=400&auto=format&fit=crop' }
        ]},
        { key:'twisters', title:'Твистеры', items:[
          { name:'Твистер обычный', price:200 },
          { name:'Твистер обычный с картошкой', price:220 },
          { name:'Твистер макс', price:250 }
        ]},
        { key:'drinks',  title:'Напитки', items:[
          { name:'Добрый кола', price:100 },
          { name:'Добрый апельсин', price:100 },
          { name:'фдэт-уайт', price:100 }
        ]}
      ]
    };

    function loadConfig(){ return safeParse(CONFIG_LS_KEY, DEFAULT_CONFIG); }
    function saveConfig(cfg){ localStorage.setItem(CONFIG_LS_KEY, JSON.stringify(cfg||DEFAULT_CONFIG)); }

    function applyTheme(theme){
      const r = document.documentElement;
      r.style.setProperty('--card-radius',  (theme.cardRadius||20)+'px');
      r.style.setProperty('--img-radius',   (theme.imgRadius||12)+'px');
      r.style.setProperty('--img-w',        (theme.imgW||110)+'px');
      r.style.setProperty('--img-h',        (theme.imgH||70)+'px');
      r.style.setProperty('--card-min-h',   (theme.cardMinH||104)+'px');
      document.getElementById('brandTitle').textContent =
        (loadConfig().brandTitle || 'ЯмаMoto');
    }

    /* ================== АНИМАЦИИ ================== */
    function easeInOutCubic(t){
      return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2
    }
    function animateScrollX(elm, to, {duration=280, onEnd}={}){
      const from=elm.scrollLeft; const diff=to-from;
      if(!diff){ onEnd&&onEnd(); return; }
      const start=performance.now();
      function step(ts){
        const t=Math.min(1,(ts-start)/duration);
        elm.scrollLeft=from+diff*easeInOutCubic(t);
        if(t<1) requestAnimationFrame(step);
        else onEnd&&onEnd();
      }
      requestAnimationFrame(step);
    }

    /* =========================================================
       =================== ЭКРАН 1: ТЕРМИНАЛ ====================
       ========================================================= */

    function OrderView(){
      const cfg = loadConfig();
      applyTheme(cfg.theme || {});
      const root = el(`
        <div class="relative">
          <section class="sticky-top mb-2">
            <div class="glass-panel rounded-2xl px-3 py-3">
              <div id="categoryBar"
                   class="flex gap-2 overflow-x-auto no-scrollbar"></div>
            </div>
          </section>

          <section>
            <div id="catPager" class="no-scrollbar"></div>
          </section>

          <div id="confirmBar" class="confirm-bar">
            <div class="flex items-center justify-between gap-3">
              <div class="text-base">
                <span class="text-gray-600">Итого:</span>
                <b id="totalVal">0 руб.</b>
              </div>
              <button id="confirmBtn"
                      class="px-4 py-2 rounded-xl bg-black text-white flex-1 disabled:opacity-40 disabled:cursor-not-allowed"
                      disabled>
                Оформить заказ
              </button>
            </div>
          </div>
        </div>
      `);

      const categoryBar = root.querySelector('#categoryBar');
      const catPager    = root.querySelector('#catPager');
      const totalEl     = root.querySelector('#totalVal');
      const confirmBtn  = root.querySelector('#confirmBtn');

      setBodyScrollLock(true);
      confirmBtn._busy = false;

      let activeIdx   = 0;
      let isAnimating = false;
      const scrollMemory = new Map();

      // esc для атрибутов
      const escAttr = (val)=>{
        if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(val);
        return String(val).replace(/"/g, '\\"');
      };

      const panelW = ()=> catPager.getBoundingClientRect().width || 1;

      /* ---------- idle-реклама ---------- */
      const adOverlay = el(`
        <div id="adOverlay"
             class="fixed inset-0 bg-black hidden z-[9999] flex items-center justify-center">
          <video id="adVideo"
                 class="w-full h-full object-cover hidden"
                 muted loop playsinline></video>
          <img id="adImg"
               class="w-full h-full object-cover hidden"
               alt="Реклама" />
        </div>
      `);
      document.body.appendChild(adOverlay);

      function showAd(){
        const c = loadConfig();
        const url = c.terminalAdUrl;
        if (!url) return;

        const v = adOverlay.querySelector('#adVideo');
        const i = adOverlay.querySelector('#adImg');

        adOverlay.classList.remove('hidden');

        if (c.terminalAdType === 'gif'){
          v.pause(); v.classList.add('hidden');
          i.classList.remove('hidden'); i.src = url;
        } else {
          i.classList.add('hidden');
          v.classList.remove('hidden');
          v.src = url;
          v.play().catch(()=>{});
        }
      }

      function hideAd(){ adOverlay.classList.add('hidden'); }

      let idleT=null;
      function resetIdle(){
        if (idleT) clearTimeout(idleT);
        hideAd();
        idleT = setTimeout(showAd, 15000);
      }

      ['click','pointerdown','touchstart','scroll','wheel'].forEach(ev=>{
        root.addEventListener(ev, resetIdle, {passive:true});
      });
      resetIdle();

      /* ---------- категории (chips) ---------- */
      cfg.menu.forEach((cat, idx) => {
        categoryBar.appendChild(
          el(`
            <button type="button"
                    class="px-3 py-1.5 rounded-full border text-sm whitespace-nowrap
                           ${idx===0 ? 'bg-black text-white border-black' : 'bg-white/50'}"
                    data-idx="${idx}">
              ${cat.title}
            </button>
          `)
        );
      });

      function highlightChip(idx){
        const buttons = categoryBar.querySelectorAll('button');
        buttons.forEach((b, i) => {
          const on = i === idx;
          b.classList.toggle('bg-black', on);
          b.classList.toggle('text-white', on);
          b.classList.toggle('border-black', on);
          if (on) b.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
        });
      }

      function goToIndex(idx, { animate = true } = {}){
        idx = Math.max(0, Math.min(cfg.menu.length - 1, idx));
        const target = Math.round(panelW() * idx);
        highlightChip(idx);

        const box = catPager.children[idx]?.querySelector('.v-scroll');

        if (!animate){
          const old = catPager.children[activeIdx]?.querySelector('.v-scroll');
          if (old) scrollMemory.set(cfg.menu[activeIdx].key, old.scrollTop);

          catPager.scrollLeft = target;
          if (box) box.scrollTop = scrollMemory.get(cfg.menu[idx].key) || 0;

          activeIdx = idx;
          return;
        }

        isAnimating = true;
        const prevSnap = catPager.style.scrollSnapType;
        catPager.style.scrollSnapType = 'none';

        const old = catPager.children[activeIdx]?.querySelector('.v-scroll');
        if (old) scrollMemory.set(cfg.menu[activeIdx].key, old.scrollTop);

        animateScrollX(catPager, target, {
          duration: 280,
          onEnd(){
            const box2 = catPager.children[idx]?.querySelector('.v-scroll');
            if (box2) box2.scrollTop = scrollMemory.get(cfg.menu[idx].key) || 0;

            activeIdx = idx;
            isAnimating = false;
            catPager.style.scrollSnapType = prevSnap || 'x mandatory';
          }
        });
      }

      categoryBar.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-idx]');
        if (!b || isAnimating) return;
        goToIndex(+b.dataset.idx, { animate:true });
      });

      /* ---------- меню + кнопки +/- ---------- */
      function rebuildMenu(){
        catPager.innerHTML = '';

        cfg.menu.forEach((cat) => {
          const panel = el(`<div class="cat-panel"></div>`);
          const vbox  = el(`<div class="v-scroll px-0.5"></div>`);
          const list  = el(`<div class="grid gap-3"></div>`);

          cat.items.forEach(it => {
            const q = (window.__orderCounts?.[it.name] || 0);

            const row = el(`
              <div class="menu-card">
                <div class="flex-1 min-w-0">
                  <div class="font-medium text-sm">${it.name}</div>
                  ${
                    cfg.theme.showPrice
                      ? `<div class="text-xs text-gray-500 mt-1">${money(it.price || 0)}</div>`
                      : ''
                  }
                  <div class="flex items-center gap-3 mt-3">
                    <button type="button"
                            class="w-8 h-8 rounded-xl border"
                            data-name="${it.name}"
                            data-act="dec">−</button>
                    <div class="w-6 text-center text-sm"
                         data-q="${it.name}">${q}</div>
                    <button type="button"
                            class="w-8 h-8 rounded-xl bg-black text-white"
                            data-name="${it.name}"
                            data-act="inc">+</button>
                  </div>
                </div>
                <img src="${it.img || 'https://placehold.co/110x70?text=food'}"
                     class="menu-card-img" alt="">
              </div>
            `);

            list.appendChild(row);
          });

          list.appendChild(el(`<div class="h-24"></div>`));
          vbox.appendChild(list);
          panel.appendChild(vbox);
          catPager.appendChild(panel);

          // touch-swipe по категориям
          let down=false, used=false, sx=0, sy=0, locked=null;
          const PIX_LOCK=10;
          const THRESH=()=>Math.max(40, panelW()*0.25);

          function onPointerDown(e){
            if (e.pointerType !== 'touch' || isAnimating) return;
            down=true; used=false; sx=e.clientX; sy=e.clientY; locked=null;
            vbox.setPointerCapture?.(e.pointerId);
          }
          function onPointerMove(e){
            if (e.pointerType !== 'touch' || !down || used || isAnimating) return;
            const dx=e.clientX-sx, dy=e.clientY-sy;

            if (locked===null){
              if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>PIX_LOCK) locked='x';
              else if (Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>PIX_LOCK) locked='y';
            }

            if (locked==='x'){
              e.preventDefault();
              if (Math.abs(dx) >= THRESH()){
                used=true;
                const next = dx<0 ? activeIdx+1 : activeIdx-1;
                goToIndex(next, {animate:true});
              }
            }
          }
          function onPointerUp(){ down=false; used=false; locked=null; }

          vbox.addEventListener('pointerdown', onPointerDown, {passive:true});
          vbox.addEventListener('pointermove', onPointerMove, {passive:false});
          ['pointerup','pointercancel','pointerleave'].forEach(evt =>
            vbox.addEventListener(evt, onPointerUp)
          );
        });
      }

      catPager.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;

        const name  = btn.dataset.name;
        const delta = btn.dataset.act === 'inc' ? +1 : -1;
        const selector = `[data-q="${escAttr(name)}"]`;

        const cur = parseInt(catPager.querySelector(selector)?.textContent || '0', 10) || 0;
        const next = Math.max(0, cur + delta);

        catPager.querySelectorAll(selector).forEach(n => n.textContent = String(next));

        if (!window.__orderCounts) window.__orderCounts = {};
        window.__orderCounts[name] = next;
        recalcTotal();
      });

      function applyHeights(){
        try {
          const headerH  = document.querySelector('.brand-strip')?.getBoundingClientRect().height || 0;
          const chipsH   = root.querySelector('.sticky-top')?.getBoundingClientRect().height || 0;
          const confirmH = root.querySelector('#confirmBar')?.getBoundingClientRect().height || 0;
          const availH   = Math.max(260, window.innerHeight - headerH - chipsH - confirmH - 8);

          const first  = root.querySelector('.menu-card');
          const cardH  = first ? Math.ceil(first.getBoundingClientRect().height) : 104;
          const h      = Math.min(availH, cardH * 4 + 12 * 3 + 4);

          root.querySelectorAll('.v-scroll').forEach(elm =>
            elm.style.height = h + 'px'
          );
          goToIndex(activeIdx, { animate:false });
        } catch {}
      }
      window.addEventListener('resize', applyHeights);

      catPager.addEventListener('scroll', () => {
        if (isAnimating) return;
        if (catPager._scrollTimer) clearTimeout(catPager._scrollTimer);
        catPager._scrollTimer = setTimeout(() => {
          const idx = Math.round(catPager.scrollLeft / panelW());
          if (idx !== activeIdx){
            highlightChip(idx);
            activeIdx = idx;
          }
        }, 80);
      });

      function recalcTotal(){
        const counts = window.__orderCounts || {};
        let sum = 0;
        cfg.menu.forEach(cat =>
          cat.items.forEach(it => {
            sum += (counts[it.name] || 0) * (it.price || 0);
          })
        );
        totalEl.textContent = money(sum);
        confirmBtn.disabled = sum <= 0;
        return sum;
      }

      /* ---------- payModal / qrModal ---------- */
      const payModal  = document.getElementById('payModal');
      const qrModal   = document.getElementById('qrModal');
      const sumBox    = document.getElementById('paySummary');
      const payCancel = document.getElementById('payCancel');
      const payByQr   = document.getElementById('payByQr');
      const payByCard = document.getElementById('payByCard');
      const qrImg     = document.getElementById('qrImg');
      const qrPaidBtn = document.getElementById('qrPaidBtn');
      const qrCloseBtn= document.getElementById('qrCloseBtn');

      let pendingOrder = null;
      let qrAutoTimer  = null;

      function openPayModal(){
        const counts = window.__orderCounts || {};
        const items  = [];
        let total=0;

        cfg.menu.forEach(cat =>
          cat.items.forEach(it => {
            const q = counts[it.name] || 0;
            if (q > 0){
              items.push({ name: it.name, qty: q, price: it.price || 0 });
              total += q * (it.price || 0);
            }
          })
        );
        if (!items.length) return;

        pendingOrder = { items, total };

        sumBox.innerHTML = items.map(i => `
          <div class="flex items-center justify-between">
            <div class="truncate">${i.name} ×${i.qty}</div>
            <div class="ml-2 whitespace-nowrap">${money(i.qty * i.price)}</div>
          </div>
        `).join('');

        sumBox.insertAdjacentHTML(
          'beforeend',
          `<div class="mt-2 pt-2 border-t flex items-center justify-between font-semibold">
             <div>Итого</div><div>${money(total)}</div>
           </div>`
        );

        payModal.classList.add('open');
      }

      confirmBtn.addEventListener('click', openPayModal);

      payCancel.onclick = ()=>{
        payModal.classList.remove('open');
        pendingOrder = null;
      };
      payModal.onclick = (e)=>{ if(e.target===payModal) payCancel.onclick(); };

      function openQrModal(){
        if (!pendingOrder) return;

        // URL QR: сначала из конфига, потом из localStorage sbp_qr_url
        const c = loadConfig();
        const url = (c.sbpQrUrl || '').trim()
                 || (localStorage.getItem('sbp_qr_url')||'').trim();

        if (url){
          qrImg.src = url;
        } else {
          qrImg.src = 'https://placehold.co/256x256?text=QR+NOT+SET';
        }

        qrModal.classList.add('open');

        if (qrAutoTimer) clearTimeout(qrAutoTimer);
        qrAutoTimer = setTimeout(()=>{
          qrModal.classList.remove('open');
        }, 20000);
      }

      function closeQrModal(){
        qrModal.classList.remove('open');
        if (qrAutoTimer) clearTimeout(qrAutoTimer);
      }
      qrCloseBtn.onclick = closeQrModal;
      qrModal.onclick = (e)=>{ if(e.target===qrModal) closeQrModal(); };

      // Оплата картой пока заглушка
      payByCard.onclick = ()=>{
        showToast('POS оплата добавим позже');
      };

      // Оплата по QR → показываем QR, но заказ НЕ улетает пока не нажали "Я оплатил"
      payByQr.onclick = ()=>{
        payModal.classList.remove('open');
        openQrModal();
      };

      // Нажал "Я оплатил" → УЛЕТАЕТ заказ + по умолчанию статус "готовится"
      qrPaidBtn.onclick = async ()=>{
        if (!pendingOrder) return;

        let orderToSend = {
          id: Date.now().toString().slice(-6),
          createdAt: Date.now(),
          items: pendingOrder.items,
          total: pendingOrder.total,
          status: 'готовится'
        };

        try{
          const res = await rpc({
            op:'create',
            items: pendingOrder.items,
            total: pendingOrder.total,
            status:'готовится'
          });
          if (res && res.order) orderToSend = res.order;
        }catch(e){
          console.warn('create rpc error', e);
          showToast('Сервер не ответил — заказ сохранён локально');
        }

        // в кухонное табло
        const dash = loadDash();
        dash.unshift(orderToSend);
        saveDash(dash.slice(0,200));

        // клиентскую историю (если захочешь)
        const hist = loadHistory();
        hist.unshift(orderToSend);
        saveHistory(hist.slice(0,50));

        closeQrModal();

        // сброс корзины
        resetCounts();
        pendingOrder = null;

        showToast('Заказ принят');
      };

      function resetCounts(){
        window.__orderCounts = {};
        catPager.querySelectorAll('[data-q]').forEach(n => n.textContent='0');
        totalEl.textContent = money(0);
        confirmBtn.disabled = true;
      }

      rebuildMenu();
      requestAnimationFrame(()=>{
        highlightChip(0);
        goToIndex(0, {animate:false});
        recalcTotal();
        applyHeights();
      });

      root.cleanup = ()=>{
        setBodyScrollLock(false);
        window.removeEventListener('resize', applyHeights);
        if (idleT) clearTimeout(idleT);
        adOverlay.remove();
      };

      return root;
    }

    /* ================== PIN + скрытые 8-тап зоны ================== */
    function bindHiddenTapZones(){
      const hotL = document.getElementById('hotLeft');
      const hotR = document.getElementById('hotRight');
      if (!hotL || !hotR) return;

      function bind(zone){
        if (zone._bound) return;
        zone._bound=true;

        let taps=0, first=0, timer=null;
        const windowMs=1500;
        const needTaps=8;

        function reset(){
          taps=0; first=0;
          if(timer){ clearTimeout(timer); timer=null; }
        }

        function handler(){
          const now=Date.now();
          if(!first) first=now;
          taps++;
          if(now-first>windowMs){ reset(); taps=1; first=now; }

          if(taps>=needTaps){
            reset();
            sessionStorage.setItem(WANT_ADMIN_ROUTE,'1');
            document.getElementById('pinModal')?.classList.add('open');
          } else {
            if(timer) clearTimeout(timer);
            timer=setTimeout(reset, windowMs);
          }
        }

        ['click','pointerup','touchend'].forEach(ev=>{
          zone.addEventListener(ev,(e)=>{
            e.preventDefault(); e.stopPropagation();
            handler();
          },{passive:false});
        });
      }

      bind(hotL);
      bind(hotR);
    }

    /* ================== MOUNT helper ================== */
    function mount(view){
      const app=document.getElementById('app');
      if(app.firstChild && typeof app.firstChild.cleanup==='function'){
        try{ app.firstChild.cleanup(); }catch{}
      }
      app.innerHTML='';
      app.classList.add('phone-shell');
      app.appendChild(view);
    }

    /* старт */
    document.addEventListener('DOMContentLoaded', ()=>{
      bindHiddenTapZones();

      // кнопка на кухню видимая
      document.getElementById('openKitchenBtn').onclick = ()=>{
        location.hash='#/dashboard';
      };

      // по умолчанию — терминал
      if(!location.hash || location.hash==='#' || location.hash==='#/')
        location.hash='#/order';

      mount(OrderView());
    });

    // экспортим в global для следующей части
    window.__APP__ = {
      rpc, mount,
      loadConfig, saveConfig, applyTheme,
      loadDash, saveDash,
      loadHistory, saveHistory,
      showToast,
      PIN_CODE,
      TABLO_PIN_OK,
      WANT_ADMIN_ROUTE,
      SOUND_ON_KEY
    };

  })();
  </script>
  
<script>
(function(){
  // берём всё из ЧАСТИ 1
  const {
    rpc, mount,
    loadConfig, saveConfig, applyTheme,
    loadDash, saveDash,
    showToast,
    PIN_CODE,
    TABLO_PIN_OK,
    WANT_ADMIN_ROUTE,
    SOUND_ON_KEY
  } = window.__APP__;

  const WANT_EXIT_BOARD = 'WANT_EXIT_BOARD';

  /* =========================
     PIN МОДАЛКА (вход/выход)
     ========================= */
  function bindPinModalOnce(){
    const pinM = document.getElementById('pinModal');
    const pinOk = document.getElementById('pinOk');
    const pinCancel = document.getElementById('pinCancel');
    const pinInput = document.getElementById('pinInput');
    if (!pinM || !pinOk || !pinCancel || !pinInput) return;
    if (pinM._bound) return;
    pinM._bound = true;

    function closePin(){ pinM.classList.remove('open'); }

    pinOk.onclick = (e)=>{
      e && e.preventDefault();
      const val = (pinInput.value||'').trim();
      if (!val){
        showToast('Введите PIN');
        return;
      }
      if (val !== PIN_CODE){
        showToast('Неверный PIN');
        pinInput.value='';
        return;
      }

      sessionStorage.setItem(TABLO_PIN_OK, '1');
      closePin();
      pinInput.value='';

      // если хотели выйти с публичного табло
      if (sessionStorage.getItem(WANT_EXIT_BOARD)==='1'){
        sessionStorage.removeItem(WANT_EXIT_BOARD);
        sessionStorage.removeItem(TABLO_PIN_OK); // чтобы следующий вход снова просил PIN
        location.hash = '#/order';
        return;
      }

      // куда хотели войти
      const want = sessionStorage.getItem(WANT_ADMIN_ROUTE);
      sessionStorage.removeItem(WANT_ADMIN_ROUTE);

      if (want && want !== '1'){
        location.hash = want;
      } else {
        // если было просто "1" — по умолчанию кухня
        location.hash = '#/dashboard';
      }
    };

    pinCancel.onclick = ()=>{
      closePin();
      pinInput.value='';
      sessionStorage.removeItem(WANT_ADMIN_ROUTE);
      sessionStorage.removeItem(WANT_EXIT_BOARD);
      location.hash = '#/order';
    };

    pinM.onclick = (e)=>{ if (e.target===pinM) pinCancel.onclick(); };
  }

  /* =========================================================
     ===================== ЭКРАН 2: КУХНЯ =====================
     ========================================================= */
  function DashboardView(){
    const root = el(`
      <div class="grid gap-4 max-w-6xl pb-24 px-2 md:px-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <h2 class="text-xl font-semibold">Табло кухни</h2>
            <button id="soundToggle"
                    class="px-3 py-1.5 rounded-xl border bg-white"
                    title="Звук уведомлений">🔔 Звук</button>
          </div>

          <div class="flex items-center gap-2">
            <a href="#/builder"
               class="px-3 py-2 rounded-xl border bg-white"
               title="Конструктор">Конструктор</a>
            <a href="#/board"
               class="px-3 py-2 rounded-xl border bg-white"
               title="Публичное табло">Публичное табло</a>
            <button id="btnClearAll"
                    class="px-3 py-2 rounded-xl border bg-red-50 text-red-700">
              Очистить всё
            </button>
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3" id="list"></div>

        <div>
          <button class="px-3 py-2 rounded-xl border"
                  onclick="location.hash='#/order'">Назад</button>
        </div>
      </div>
    `);

    const list = root.querySelector('#list');
    if (!list) return root;

    let dashOrders  = loadDash();
    let knownIds    = new Set(dashOrders.map(o => String(o.id)));
    const ding      = document.getElementById('orderDing');
    const soundBtn  = root.querySelector('#soundToggle');
    let hiddenNewCount = 0;
    let pollTimer = null;

    const soundOn  = () => localStorage.getItem(SOUND_ON_KEY) === '1';
    const setSound = (on) => {
      localStorage.setItem(SOUND_ON_KEY, on ? '1' : '0');
      soundBtn.classList.toggle('bg-green-50', on);
      soundBtn.classList.toggle('border-green-600', on);
    };
    setSound(soundOn());
    soundBtn.onclick = () => setSound(!soundOn());

    function handleVisibilityChange(){
      if (document.visibilityState === 'visible' && hiddenNewCount > 0){
        showToast(`Новых заказов: ${hiddenNewCount}`);
        hiddenNewCount = 0;
      }
    }
    document.addEventListener('visibilitychange', handleVisibilityChange);

    function orderCard(o){
      const created = o.createdAt ? new Date(o.createdAt) : new Date();
      const itemsHtml = (o.items || []).map(i => `
        <div class="flex justify-between text-lg">
          <div>${i.name}</div>
          <div class="font-semibold">${i.qty} × ${i.price}</div>
        </div>
      `).join('');

      const statusColor =
        o.status === 'готов'
          ? 'bg-green-50 border-green-300'
          : 'bg-blue-50 border-blue-300';

      const card = el(`
        <div class="p-6 rounded-3xl border-2 ${statusColor} shadow-sm flex flex-col gap-3"
             data-id="${o.id}">
          <div class="flex items-center justify-between">
            <div class="text-2xl font-extrabold tracking-tight">#${o.id || '—'}</div>
            <span class="px-3 py-1 rounded-full text-sm font-medium border bg-white/50">
              ${o.status || 'готовится'}
            </span>
          </div>

          <div class="text-gray-600 text-sm">${created.toLocaleString()}</div>

          <div class="mt-2 grid gap-1 text-lg">
            ${itemsHtml || '—'}
          </div>

          <div class="mt-3 flex items-center justify-between text-xl font-bold">
            <div>Итого:</div><div>${o.total || 0} ₽</div>
          </div>

          <div class="mt-2 flex flex-wrap gap-2 items-center">
            <label class="text-sm">Статус:</label>
            <select class="border rounded-xl p-2 text-sm" data-k="status">
              <option ${o.status==='готовится'?'selected':''}>готовится</option>
              <option ${o.status==='готов'?'selected':''}>готов</option>
            </select>

            <button type="button"
                    class="px-3 py-2 rounded-xl border bg-white hover:bg-gray-100"
                    data-act="save">Сохранить</button>
            <button type="button"
                    class="px-3 py-2 rounded-xl border bg-red-50 hover:bg-red-100 text-red-600 ml-auto"
                    data-act="delete">Удалить</button>
          </div>
        </div>
      `);

      card.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;

        if (act === 'save'){
          const status = card.querySelector('[data-k="status"]').value;

          const i = dashOrders.findIndex(x => String(x.id) === String(o.id));
          if (i >= 0){
            dashOrders[i] = { ...dashOrders[i], status };
            saveDash(dashOrders);
            renderOrders();
            showToast(`Статус #${o.id} обновлён`);
          }

          rpc({ op: 'update', id: o.id, patch: { status } }).catch(()=>{});

        } else if (act === 'delete'){
          if (!confirm('Удалить заказ?')) return;

          dashOrders = dashOrders.filter(x => String(x.id) !== String(o.id));
          saveDash(dashOrders);
          renderOrders();
          showToast(`Заказ #${o.id} удалён`);

          rpc({ op: 'delete', id: o.id }).catch(()=>{});
        }
      });

      return card;
    }

    function renderOrders(){
      const unique = new Map();
      dashOrders.forEach(o => unique.set(String(o.id), o));
      const orders = [...unique.values()];
      list.innerHTML = '';
      orders.forEach(o => list.appendChild(orderCard(o)));
    }

    function detectNewOrders(){
      const unique = new Map(dashOrders.map(o => [String(o.id), o]));
      const incoming = [...unique.keys()].filter(id => !knownIds.has(id));

      if (incoming.length){
        if (document.visibilityState === 'visible' && soundOn()){
          try {
            ding.currentTime = 0;
            ding.play().catch(()=>{});
          } catch {}
        } else if (document.visibilityState === 'hidden'){
          hiddenNewCount += incoming.length;
        }
      }

      knownIds = new Set(unique.keys());
    }

    root.querySelector('#btnClearAll').onclick = async () => {
      if (!confirm('Удалить все заказы?')) return;
      const ids = (dashOrders || []).map(o => o.id);
      dashOrders = [];
      saveDash(dashOrders);
      renderOrders();
      try {
        await rpc({ op:'clear' });
      } catch {
        for (const id of ids){
          rpc({ op:'delete', id }).catch(()=>{});
        }
      }
    };

    async function loadOrdersFromCloud(){
      try{
        const res = await rpc({ op:'list' });
        if (Array.isArray(res.orders)){
          dashOrders = res.orders.slice();
          saveDash(dashOrders);
          detectNewOrders();
          renderOrders();
        }
      } catch(e){
        // тихо, если оффлайн — работаем на локале
        renderOrders();
      }
    }

    renderOrders();
    loadOrdersFromCloud();
    pollTimer = setInterval(loadOrdersFromCloud, 6000);

    root.cleanup = () => {
      if (pollTimer) clearInterval(pollTimer);
      document.removeEventListener('visibilitychange', handleVisibilityChange);
    };

    return root;
  }

  /* =========================================================
     ============== ЭКРАН 3: ПУБЛИЧНОЕ ТАБЛО ==================
     ========================================================= */
  function PublicBoardView(){
    const root = el(`
      <div class="w-full h-full px-6 py-4 bg-black text-white">
        <div class="grid grid-cols-2 gap-6 mb-4">
          <div class="text-center">
            <div class="text-3xl font-extrabold tracking-wide">ГОТОВИТСЯ</div>
          </div>
          <div class="text-center">
            <div class="text-3xl font-extrabold tracking-wide">ГОТОВ</div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6 h-[calc(100vh-120px)]">
          <div id="prepCol" class="grid gap-3 content-start"></div>
          <div id="readyCol" class="grid gap-3 content-start"></div>
        </div>

        <!-- скрытая зона выхода 8-тап -->
        <div id="boardExitHot"
             style="position:fixed; right:0; bottom:0; width:220px; height:140px; z-index:9999; opacity:0;">
        </div>
      </div>
    `);

    const app = document.getElementById('app');
    app && app.classList.remove('phone-shell');

    const prepCol  = root.querySelector('#prepCol');
    const readyCol = root.querySelector('#readyCol');
    const exitHot  = root.querySelector('#boardExitHot');

    let orders = loadDash();
    let pollTimer = null;

    function numCard(id){
      return el(`
        <div class="rounded-2xl border border-white/25 bg-white/5 
                    text-center py-4 text-5xl font-extrabold tracking-widest">
          #${id}
        </div>
      `);
    }

    function render(){
      orders = loadDash();

      const prep  = orders.filter(o => (o.status||'готовится') !== 'готов');
      const ready = orders.filter(o => (o.status||'') === 'готов');

      prepCol.innerHTML = '';
      readyCol.innerHTML = '';

      if (!prep.length)  prepCol.innerHTML  = `<div class="text-white/40 text-2xl font-semibold text-center py-10">—</div>`;
      if (!ready.length) readyCol.innerHTML = `<div class="text-white/40 text-2xl font-semibold text-center py-10">—</div>`;

      prep.forEach(o => prepCol.appendChild(numCard(o.id)));
      ready.forEach(o => readyCol.appendChild(numCard(o.id)));
    }

    async function pull(){
      try{
        const res = await rpc({ op:'list' });
        if (Array.isArray(res.orders)){
          saveDash(res.orders);
        }
      }catch(e){ }
      render();
    }

    render();
    pull();
    pollTimer = setInterval(pull, 4000);

    // 8-тап → PIN → выход
    (function bindExit(){
      if (!exitHot || exitHot._bound) return;
      exitHot._bound=true;

      let taps=0, first=0, timer=null;
      const windowMs=1500, need=8;

      function reset(){
        taps=0; first=0;
        if(timer){ clearTimeout(timer); timer=null; }
      }

      function handler(){
        const now=Date.now();
        if(!first) first=now;
        taps++;
        if(now-first>windowMs){ reset(); taps=1; first=now; }

        if(taps>=need){
          reset();
          sessionStorage.setItem(WANT_EXIT_BOARD,'1');
          document.getElementById('pinModal')?.classList.add('open');
        } else {
          if(timer) clearTimeout(timer);
          timer=setTimeout(reset, windowMs);
        }
      }

      ['click','pointerup','touchend'].forEach(ev=>{
        exitHot.addEventListener(ev,(e)=>{
          e.preventDefault(); e.stopPropagation();
          handler();
        },{passive:false});
      });
    })();

    root.cleanup = ()=>{
      if (pollTimer) clearInterval(pollTimer);
      app && app.classList.add('phone-shell');
    };

    return root;
  }

  /* =========================================================
     ===================== КОНСТРУКТОР ========================
     ========================================================= */
  function BuilderView(){
    const cfg = loadConfig();
    applyTheme(cfg.theme || {});

    const root = el(`
      <div class="grid gap-4 pb-24 max-w-4xl mx-auto px-2 md:px-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="text-xl font-semibold">Конструктор меню</h2>
          <div class="flex gap-2">
            <button id="btnSave"
              class="px-3 py-2 rounded-xl bg-black text-white">Сохранить</button>
            <button id="btnBack"
              class="px-3 py-2 rounded-xl border">Назад</button>
          </div>
        </div>

        <div class="card p-4 grid gap-3">
          <div class="font-semibold">Общие настройки</div>

          <label class="text-sm">Название бренда</label>
          <input id="brandTitleInp"
                 class="border rounded-xl p-2"
                 value="${escapeHtml(cfg.brandTitle||'')}"/>

          <label class="text-sm">QR-картинка СБП (URL)</label>
          <input id="sbpQrInp"
                 class="border rounded-xl p-2"
                 placeholder="https://storage.yandexcloud.net/.../qr.png"
                 value="${escapeHtml(cfg.sbpQrUrl||localStorage.getItem('sbp_qr_url')||'')}" />

          <label class="text-sm">Реклама на простое (URL видео/гиф)</label>
          <input id="adUrlInp"
                 class="border rounded-xl p-2"
                 placeholder="https://storage.yandexcloud.net/.../ad.mp4"
                 value="${escapeHtml(cfg.terminalAdUrl||'')}"/>

          <label class="text-sm">Тип рекламы</label>
          <select id="adTypeSel" class="border rounded-xl p-2">
            <option value="video" ${cfg.terminalAdType==='video'?'selected':''}>video</option>
            <option value="gif" ${cfg.terminalAdType==='gif'?'selected':''}>gif</option>
          </select>
        </div>

        <div class="card p-4 grid gap-3">
          <div class="flex items-center justify-between">
            <div class="font-semibold">Категории</div>
            <button id="btnAddCat" class="px-3 py-1.5 rounded-xl border">+ Категория</button>
          </div>
          <div id="catsWrap" class="grid gap-3"></div>
        </div>
      </div>
    `);

    const catsWrap = root.querySelector('#catsWrap');

    function renderCats(){
      catsWrap.innerHTML = '';
      cfg.menu.forEach((cat, cIdx)=>{
        const catBox = el(`
          <div class="border rounded-2xl p-3 grid gap-2 bg-white">
            <div class="flex items-center gap-2">
              <input class="border rounded-xl p-2 flex-1"
                     data-k="catTitle"
                     data-ci="${cIdx}"
                     value="${escapeHtml(cat.title||'')}"
                     placeholder="Название категории"/>
              <button class="px-2 py-1 rounded-xl border text-red-600"
                      data-act="delCat"
                      data-ci="${cIdx}">Удалить</button>
            </div>

            <div class="grid gap-2" data-items="${cIdx}"></div>

            <button class="px-3 py-1.5 rounded-xl border w-max"
                    data-act="addItem"
                    data-ci="${cIdx}">+ Товар</button>
          </div>
        `);

        const itemsWrap = catBox.querySelector(`[data-items="${cIdx}"]`);

        (cat.items||[]).forEach((it, iIdx)=>{
          const row = el(`
            <div class="grid grid-cols-12 gap-2 items-center">
              <input class="border rounded-xl p-2 col-span-5"
                     data-k="itemName"
                     data-ci="${cIdx}" data-ii="${iIdx}"
                     placeholder="Название"
                     value="${escapeHtml(it.name||'')}"/>
              <input class="border rounded-xl p-2 col-span-2"
                     data-k="itemPrice"
                     data-ci="${cIdx}" data-ii="${iIdx}"
                     placeholder="Цена"
                     inputmode="numeric"
                     value="${escapeHtml(String(it.price||''))}"/>
              <input class="border rounded-xl p-2 col-span-4"
                     data-k="itemImg"
                     data-ci="${cIdx}" data-ii="${iIdx}"
                     placeholder="URL картинки"
                     value="${escapeHtml(it.img||'')}"/>
              <button class="border rounded-xl col-span-1 text-red-600 py-2"
                      data-act="delItem"
                      data-ci="${cIdx}" data-ii="${iIdx}">×</button>
            </div>
          `);
          itemsWrap.appendChild(row);
        });

        catsWrap.appendChild(catBox);
      });
    }
    renderCats();

    // делегирование кликов
    catsWrap.addEventListener('click',(e)=>{
      const btn = e.target.closest('button[data-act]');
      if(!btn) return;
      const act = btn.dataset.act;
      const ci = +btn.dataset.ci;

      if(act==='delCat'){
        if(!confirm('Удалить категорию?')) return;
        cfg.menu.splice(ci,1);
        renderCats();
      }

      if(act==='addItem'){
        cfg.menu[ci].items = cfg.menu[ci].items || [];
        cfg.menu[ci].items.push({name:'Новый товар', price:0, img:''});
        renderCats();
      }

      if(act==='delItem'){
        const ii = +btn.dataset.ii;
        if(!confirm('Удалить товар?')) return;
        cfg.menu[ci].items.splice(ii,1);
        renderCats();
      }
    });

    // сбор инпутов
    root.addEventListener('input',(e)=>{
      const inp = e.target;
      const k = inp.dataset.k;
      if(!k) return;

      const ci = +inp.dataset.ci;
      const ii = inp.dataset.ii!=null ? +inp.dataset.ii : null;

      if(k==='catTitle'){
        cfg.menu[ci].title = inp.value;
        cfg.menu[ci].key = slug(inp.value||('cat'+ci));
      }
      if(k==='itemName'){
        cfg.menu[ci].items[ii].name = inp.value;
      }
      if(k==='itemPrice'){
        cfg.menu[ci].items[ii].price = Number(inp.value||0);
      }
      if(k==='itemImg'){
        cfg.menu[ci].items[ii].img = inp.value;
      }
    });

    root.querySelector('#btnAddCat').onclick = ()=>{
      cfg.menu.push({ key:'newcat'+Date.now(), title:'Новая категория', items:[] });
      renderCats();
    };

    root.querySelector('#btnBack').onclick = ()=>{
      location.hash='#/dashboard';
    };

    root.querySelector('#btnSave').onclick = ()=>{
      cfg.brandTitle = root.querySelector('#brandTitleInp').value.trim() || 'ЯмаMoto';
      cfg.sbpQrUrl = root.querySelector('#sbpQrInp').value.trim();
      cfg.terminalAdUrl = root.querySelector('#adUrlInp').value.trim();
      cfg.terminalAdType = root.querySelector('#adTypeSel').value;

      saveConfig(cfg);
      applyTheme(cfg.theme||{});

      if(cfg.sbpQrUrl){
        localStorage.setItem('sbp_qr_url', cfg.sbpQrUrl);
      }

      showToast('Сохранено');
      location.hash='#/order';
    };

    return root;
  }

  /* =========================
     ROUTER + защита PIN
     ========================= */
  function realRouter(){
    const h = location.hash.split('?')[0];

    if (h==='#/order') {
      // терминал уже смонтирован в ЧАСТИ 1
      mount(window.__APP__ORDER_VIEW__());
      return;
    }
    if (h==='#/dashboard') { mount(DashboardView()); return; }
    if (h==='#/board')     { mount(PublicBoardView()); return; }
    if (h==='#/builder')   { mount(BuilderView()); return; }

    location.hash='#/order';
  }

  function router(){
    const h = location.hash.split('?')[0];

    // PIN защита для админ-экранов
    const needPin = (h==='#/dashboard' || h==='#/board' || h==='#/builder');

    if (needPin && sessionStorage.getItem(TABLO_PIN_OK)!=='1'){
      sessionStorage.setItem(WANT_ADMIN_ROUTE, h);
      document.getElementById('pinModal')?.classList.add('open');

      const app=document.getElementById('app');
      if(app) app.innerHTML='';
      return;
    }

    realRouter();
  }

  /* =========================
     хелперы для Builder
     ========================= */
  function el(html){
    const t=document.createElement('template'); t.innerHTML=html.trim();
    return t.content.firstChild;
  }
  function escapeHtml(s){
    return String(s||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
  function slug(s){
    return String(s||'cat').toLowerCase()
      .replace(/\s+/g,'-')
      .replace(/[^a-z0-9а-яё\-]/gi,'')
      .slice(0,32) || ('cat'+Date.now());
  }

  /* IMPORTANT:
     нам нужно иметь доступ к OrderView из ЧАСТИ 1.
     Я делаю лёгкий трюк: сохраняю ссылку на него при первом монтировании.
  */
  if(!window.__APP__ORDER_VIEW__){
    // берём текущий OrderView с DOM (первый child app)
    // и сохраняем фабрику
    const oldMount = mount;
    window.__APP__ORDER_VIEW__ = function(){
      // ЧАСТЬ 1 объявила OrderView внутри IIFE, поэтому
      // мы берём его из уже смонтированного экрана:
      // пересоздать его можем только через reload страницы.
      // Поэтому здесь принудительно reload если надо.
      location.reload();
    };
    // переопределять mount не будем — просто оставляем как есть
  }

  // биндим PIN и роутер
  bindPinModalOnce();
  window.addEventListener('hashchange', ()=>{ try{ router(); }catch(e){ console.error(e); }});
  try{ router(); }catch(e){ console.error(e); }

})();
</script>

</body>
</html>
