<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <title>Терминал ЯмаMoto</title>

  <!-- Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body {
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      display: block;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal.open {
      display: flex;
    }

    .hidden-zone {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 200px;
      height: 150px;
      opacity: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- =============================== -->
  <!--     ЭКРАН 1 — ТЕРМИНАЛ          -->
  <!-- =============================== -->
  <div id="screen-order" class="screen active">
    <div class="bg-red-600 text-white px-4 py-3 text-2xl font-extrabold">ЯмаMoto</div>

    <div class="p-4">
      <!-- Категории -->
      <div id="categoryBar" class="flex gap-2 overflow-x-auto mb-3 no-scrollbar"></div>

      <!-- Товары -->
      <div id="productsArea" class="grid gap-3"></div>
    </div>

    <!-- ИТОГО + кнопка -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t px-4 py-3 flex justify-between items-center">
      <div class="text-xl">
        Итого: <b id="orderTotal">0 ₽</b>
      </div>
      <button id="orderConfirmBtn" disabled class="px-5 py-2 rounded-xl bg-black text-white text-lg disabled:opacity-30">
        Оформить
      </button>
    </div>

    <!-- скрытая зона для входа на кухню -->
    <div id="enterKitchenZone" class="hidden-zone"></div>
  </div>
