<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ЯмаMoto — терминал</title>

  <!-- Tailwind (можно оставить, удобно для верстки) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-gray-50">

  <div class="w-full">
    <!-- Красная шапка -->
    <div class="brand-strip">
      <div class="shell header-row flex items-center justify-between">
        <div class="brand-wrap">
          <div class="sushi-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#fff"/>
              <circle cx="12" cy="12" r="7" fill="#e50000"/>
              <circle cx="12" cy="12" r="4" fill="#000"/>
            </svg>
          </div>
          <div class="leading-tight">
            <div class="brand-title" id="brandTitle">ЯмаMoto</div>
            <div class="brand-sub">суши • роллы • фастфуд</div>
          </div>
        </div>

        <!-- личного кабинета нет -->
      </div>
    </div>
    <div class="header-ghost"></div>

    <!-- сюда рендерятся экраны -->
    <main id="app" class="shell"></main>
  </div>

  <!-- Плавающая кнопка входа на кухню/табло (PIN внутри) -->
  <button id="openDashBtn" title="Табло" aria-label="Табло">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="4" width="18" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
      <rect x="3" y="14" width="18" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M7 7h4M7 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Модалка подтверждения заказа -->
  <div id="payModal" class="modal">
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 class="modal-title">Подтверждение заказа</h3>
      <div id="paySummary" class="modal-summary"></div>
      <div class="modal-actions">
        <button id="payCancel" type="button" class="btn btn-ghost">Изменить</button>
        <button id="payOk" type="button" class="btn btn-primary">ОК</button>
      </div>
    </div>
  </div>

  <!-- PIN модалка (вход/выход в админ-экраны) -->
  <div id="pinModal" class="modal">
    <div class="modal-card max-w-xs text-center">
      <h3 class="modal-title">Введите ключ</h3>
      <input id="pinInput" class="pin-input" placeholder="введите ключ" inputmode="text">
      <div class="modal-actions">
        <button id="pinCancel" class="btn btn-ghost">Отмена</button>
        <button id="pinOk" class="btn btn-primary">ОК</button>
      </div>
    </div>
  </div>

  <!-- QR модалка СБП -->
  <div id="qrModal" class="modal">
    <div class="modal-card text-center">
      <h3 class="modal-title">Оплата по СБП</h3>
      <div class="text-sm text-gray-600">Отсканируйте QR и оплатите заказ</div>
      <img id="qrImg" class="qr-img" alt="QR">
      <a id="qrLink" class="qr-link" href="#" target="_blank" rel="noopener">Открыть ссылку оплаты</a>
      <div class="text-xs text-gray-500 mt-2">Оплата картой — у кассира/терминала POS</div>
      <button id="qrOk" type="button" class="btn btn-primary w-full mt-3">Готово</button>
    </div>
  </div>

  <!-- тост -->
  <div id="toast" class="toast hidden"></div>

  <!-- звук новых заказов -->
  <audio id="orderDing" preload="auto">
    <source src="https://storage.yandexcloud.net/audio123/z_uk-budte-vkontakte-s-no_ostyami%20(1).mp3" type="audio/mpeg">
  </audio>

  <!-- полифилы для старых браузеров -->
  <script>
    if (!Element.prototype.matches) {
      Element.prototype.matches =
        Element.prototype.msMatchesSelector ||
        Element.prototype.webkitMatchesSelector ||
        function (selector) {
          const matches = (this.document || this.ownerDocument).querySelectorAll(selector);
          let i = matches.length;
          while (--i >= 0 && matches.item(i) !== this) {}
          return i > -1;
        };
    }
    if (!Element.prototype.closest) {
      Element.prototype.closest = function (selector) {
        let el = this;
        while (el && el.nodeType === 1) {
          if (el.matches(selector)) return el;
          el = el.parentElement || el.parentNode;
        }
        return null;
      };
    }
    if (!window.CSS) window.CSS = {};
    if (typeof window.CSS.escape !== 'function') {
      window.CSS.escape = function (value) {
        return String(value).replace(/"/g, '\\"');
      };
    }
  </script>

  <!-- подключаем приложение -->
  <script src="./app.js" defer></script>
  <script src="./order-view.js" defer></script>
  <script src="./dashboard-view.js" defer></script>
  <script src="./public-board-view.js" defer></script>
  <script src="./builder-view.js" defer></script>
</body>
</html>
