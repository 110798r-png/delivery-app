<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>BELISSIMO — локальный стенд</title>
  
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c3af96">

  <!-- PWA / iOS full-screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BELISSIMO">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="icon" href="data:,">
  <style>
    html, body { width:100%; max-width:100%; overflow-x:hidden; background:#f9fafb; }
    
    html, body{
  height: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

    .bottom-spacer{
  height: 120px;     /* запас под нижнюю панель */
}

@media (min-width: 640px){
  .bottom-spacer{
    height: 140px;
  }
}
    
    *, *::before, *::after { box-sizing:border-box; }
    img { max-width:100%; display:block; }
    .hidden{ display:none }
    .phone-shell{ width:min(100vw,540px); margin:0 auto; padding:0 .35rem; }

    .toast{ position:fixed; right:1rem; bottom:1rem; background:#111; color:#fff; padding:.75rem 1rem; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.2); opacity:.95; z-index:9999 }

    .glass-panel{ background:radial-gradient(circle at 10% 20%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.45) 45%, rgba(255,255,255,.25) 100%); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.4); box-shadow:0 14px 40px rgba(15,23,42,.12) }
    .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none }
    .sticky-top{ position:sticky; top:.5rem; z-index:30 }

    .menu-card{ display:flex; gap:.75rem; align-items:center; background:#fff; border:1px solid #edf2f7; border-radius:var(--card-radius, 1.25rem); padding:1rem; min-height:var(--card-min-h, 6.4rem) }
    .menu-card-img{ width:var(--img-w,110px); height:var(--img-h,70px); border-radius:var(--img-radius,.75rem); background:#eee; object-fit:cover }

    .confirm-bar{ position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(540px, 100%); background:#fff; border-top:1px solid #e5e7eb; padding:.6rem .9rem; z-index:50; box-shadow:0 -10px 25px rgba(15,23,42,.06) }

    #catPager{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; touch-action: pan-x pinch-zoom; }
    
      /* Внешний контейнер просто обрезает лишнее */
#promoStrip{
  overflow: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pinch-zoom;
}

/* Внутренний реально скроллится по X */
#promoStripInner{
  display: flex;
  overflow-x: auto;      /* ВАЖНО */
  scroll-behavior: auto; /* анимацию делаем сами */
}

/* Один слайд = 100% ширины экрана */
.promo-slide{
  flex: 0 0 100%;
}

    .cat-panel{ flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop: always; padding:0; }
    .v-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action: pan-y; }
    
    .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:90 }
    .modal.open{ display:flex }

    .app-header{ position:sticky; top:0; z-index:100; }

    button[data-act], #profileBtn, #payOk, #payCancel, #backBtn { touch-action: manipulation; }
    .badge{ display:inline-flex; align-items:center; gap:.35rem; border-radius:.6rem; padding:.15rem .5rem; font-size:.75rem; background:#f1f5f9; color:#334155 }
    .badge.red{ background:#fee2e2; color:#991b1b }

    .card{ border-radius:1.25rem; background:#fff; border:1px solid #edf2f7; box-shadow:0 8px 24px rgba(15,23,42,.06); }
    .card-tall{ min-height: 164px; }
    .rowlink{ background:#fff; border:1px solid #e5e7eb; border-radius:1rem; padding:16px 18px; font-weight:600 }

    #tabloTapZone{ height:64px; display:flex; justify-content:flex-end; align-items:center; }
    #tabloTapHot{ width:140px; height:52px; border-radius:12px; }

    .chip{ display:inline-block; padding:.2rem .6rem; border-radius:999px; font-size:.75rem; }

    /* --- Красная шапка --- */
    .brand-strip{ background:#c3af96; color:#fff; }
    .brand-title{ font-weight:900; font-size:24px; line-height:1; letter-spacing:.2px; }
    .brand-sub{ font-size:11px; line-height:1; opacity:.9; margin-top:2px; letter-spacing:.3px }
    .brand-wrap{ display:flex; align-items:center; gap:10px; }

    /* Обёртка под иконку — без чёрного фона */
.sushi-icon{
  width:48px;              /* размер области под иконку, можно менять */
  height:48px;
  display:grid;
  place-items:center;
  background:transparent;  /* убираем чёрный круг */
  border-radius:0;         /* можно оставить 0, чтобы не было круглой маски */
}

/* Размер самой иконки стакана */
#brandIcon{
  width:45px;              /* увеличивай/уменьшай под себя */
  height:45px;
  object-fit:contain;
}
    
    .header-row{ padding:10px 12px; }
    .header-ghost{ height:8px; }
    /* Отключаем выделение текста у основных интерактивов */
button, a, svg, .brand-strip, .header-row {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

    /* Делаем кнопку профиля невидимой, но оставляем активной */
#profileBtn {
  opacity: 0;
}
    
/* Убираем рамку фокуса с кнопок/ссылок (чтобы не "залипала" после тапов) */
button:focus, a:focus {
  outline: none;
  box-shadow: none;
}

    /* Увеличиваем кнопки + и - */
button[data-act="dec"],
button[data-act="inc"]{
  width:50px !important;    /* можно 70-80, если нужно ещё больше */
  height:50px !important;
  font-size:2rem;           /* размер знака +/- */
  border-radius:18px;       /* более скруглённые */
}

   /* Карточка заказа на табло */
.order-card{
  min-height: 240px;          /* базовая высота как на макете */
  display: flex;
  flex-direction: column;
}

/* Блок с позициями внутри карточки */
.order-card-items{
  flex: 1 1 auto;             /* растягивается, выталкивает низ вниз */
  min-height: 0;
  overflow-y: hidden;         /* ничего не вылезает поверх Итого */
}


/* Сетка с заказами – по центру, от края до края в разумных пределах */
#list {
  width: 100%;
}

    <style>
  /* Правила только для печати */
  @media print {
    /* Всё, что помечено no-print, не выводим на чек */
    .no-print {
      display: none !important;
    }

    /* Каждый ордер — с новой страницы (если несколько штук печатаешь сразу) */
    .order-card {
      page-break-after: always;
      break-after: page;
    }

    /* Можно чуть упростить фон для принтера */
    body {
      background: #fff !important;
    }
  }
</style>
    
  </style>
</head>
<body>
  <div class="w-full">
    <!-- Красная шапка -->
    <div class="brand-strip">
      <div class="phone-shell header-row flex items-center justify-between">
        <div class="brand-wrap">
        <div class="sushi-icon" aria-hidden="true">
  <img id="brandIcon" src="" alt="">
</div>
          <div class="leading-tight">
            <div class="brand-title" id="brandTitle">BELISSIMO</div>
            <div class="brand-sub">суши • роллы • фастфуд</div>
          </div>
        </div>
        <!-- Профиль со стрелочкой -->
        <a id="profileBtn" href="javascript:void(0)"
           class="px-3 py-2 rounded-xl border bg-white text-black flex items-center gap-1"
           aria-label="Профиль" role="button" title="Профиль">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" fill="currentColor"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <button id="backBtn" class="hidden px-3 py-2 rounded-xl border bg-white text-black select-none" aria-label="Назад" title="Назад">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-ghost"></div>
    
    <main id="app" class="phone-shell"></main>
  </div>

    <!-- Спасибо за заказ -->
  <div id="payModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-xl" role="dialog" aria-modal="true">
      <div id="paySummary" class="text-sm bg-gray-50 border rounded-xl p-3 max-h-48 overflow-auto"></div>

      <!-- скрытый селект только для логики -->
      <select id="paySelect" class="hidden">
        <option value="cash" selected>Наличные</option>
      </select>

      <div class="flex justify-end gap-2 pt-1">
        <button id="payCancel" type="button" class="px-3 py-2 rounded-xl border">Изменить</button>
        <button id="payOk" type="button" class="px-3 py-2 rounded-xl bg-black text-white">Готово</button>
      </div>
    </div>
  </div>

    <!-- Короткая модалка "Спасибо" -->
  <div id="doneModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs text-center shadow-xl">
      <h3 class="text-lg font-semibold mb-2">Спасибо!</h3>
      <p class="text-sm text-gray-600">Ваш заказ скоро будет готов.</p>
    </div>
  </div>

  <!-- Ключ для табло -->
  <div id="pinModal" class="modal">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs space-y-3 shadow-xl text-center">
      <h3 class="text-lg font-semibold">Введите ключ</h3>
      <input id="pinInput" class="border rounded-2xl p-3 w-full text-center" placeholder="введите ключ" inputmode="text">
      <div class="flex justify-end gap-2">
        <button id="pinCancel" class="px-3 py-2 rounded-xl border">Отмена</button>
        <button id="pinOk" class="px-3 py-2 rounded-xl bg-black text-white">ОК</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- звук уведомления -->
  <audio id="orderDing" preload="auto">
    <source src="https://storage.yandexcloud.net/audio123/z_uk-budte-vkontakte-s-no_ostyami%20(1).mp3" type="audio/mpeg">
  </audio>
  
<script src="app.js" defer></script>

  
</body>
</html>
